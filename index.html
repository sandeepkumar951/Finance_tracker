<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💵 Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
<style>
:root{
--bg:#EEEBE5;--bg2:#FFFFFF;--bg3:#E6E2D9;--bg4:#DAD6CE;--bg5:#D0CCC5;
--border:rgba(59,31,14,0.08);--border2:rgba(59,31,14,0.15);
--text:#1A1208;--text2:#6B5C4E;--text3:#A89888;
--accent:#3B1F0E;--accent2:#5C3420;--aglow:rgba(59,31,14,0.08);
--green:#639922;--gbg:rgba(99,153,34,0.08);
--red:#E24B4A;--rbg:rgba(226,75,74,0.08);--blue:#378ADD;
--r:12px;--rl:18px;
--font:'Montserrat','Segoe UI',sans-serif;--mono:'JetBrains Mono',monospace;
--sw:275px;--tw:300px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background-color:#EEEBE5;background-image:linear-gradient(135deg,#EEEBE5 0%,#E6E2D9 100%);background-attachment:fixed;color:var(--text);font-family:var(--font);font-size:14px}
body{min-height:100vh;background:transparent}
.shell{display:flex;align-items:stretch;min-height:100vh;height:auto;}
.sidebar{position:sticky;top:0;width:var(--sw);height:100vh;min-height:100vh;max-height:100vh;align-self:flex-start;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(59,31,14,.20) transparent;background:rgba(250,246,240,.92);backdrop-filter:blur(18px);border-right:1px solid rgba(59,31,14,.10);}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(59,31,14,.20);border-radius:999px}
.sidebar-logo{flex:0 0 auto;padding:1.1rem 1rem 0.85rem;}
.sidebar-views{flex:0 0 auto;padding:0 1rem 0.5rem;}
.s-sep{flex:0 0 auto;height:1px;background:var(--border);margin:0;}
.sidebar-spending{flex:0 0 auto;padding:0.6rem 1rem 0.5rem;}
.sidebar-add{flex:0 0 auto;padding:0.5rem 1rem 0.6rem;}
.sidebar-months-lbl{flex:0 0 auto;padding:0.5rem 1rem 0.25rem;font-size:9px;font-weight:800;color:var(--text3);letter-spacing:0.14em;text-transform:uppercase;}
.sidebar-months{flex:0 0 auto;min-height:0;overflow-y:visible;overflow-x:hidden;padding:0 1rem 0.75rem;}
.sidebar-months::-webkit-scrollbar{width:4px}
.sidebar-months::-webkit-scrollbar-thumb{background:rgba(59,31,14,.18);border-radius:999px}
.sidebar-months-inner{padding-bottom:.5rem}
.s-footer{flex:0 0 auto;padding:0.55rem 1rem 0.7rem;border-top:1px solid var(--border);background:rgba(250,246,240,.96);backdrop-filter:blur(14px);position:sticky;bottom:0;z-index:2;}
.nav-lbl{font-size:9px;font-weight:800;color:var(--text3);letter-spacing:0.14em;text-transform:uppercase;padding:0.5rem 0 0.25rem;}
.spie-wrap{}
.spie-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.55rem}
.spie-title{font-size:9px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:0.13em}
.spie-badge{font-size:8px;font-weight:700;color:var(--accent);background:var(--aglow);border:1px solid var(--border2);padding:2px 7px;border-radius:10px}
.spie-canvas-wrap{position:relative;width:100%;max-width:170px;margin:0 auto;aspect-ratio:1/1}
.spie-canvas-wrap canvas{width:100%!important;height:100%!important}
.spie-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:58%}
.spie-amt{font-size:15px;font-weight:800;font-family:var(--font);color:var(--text);letter-spacing:-0.8px;line-height:1.1}
.spie-lbl{font-size:8px;font-weight:600;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;margin-top:3px}
.spie-legend{display:flex;flex-direction:column;gap:5px;margin-top:0.65rem}
.spl-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.spl-left{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.spl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.spl-name{font-size:10px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spl-right{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-shrink:0}
.spl-val{font-size:10px;font-family:var(--mono);color:var(--text);font-weight:600}
.spl-pct{font-size:8px;font-family:var(--mono);font-weight:600;padding:1px 5px;border-radius:999px;border:0;outline:0;box-shadow:none;line-height:1.35}
.spie-empty{text-align:center;padding:1rem 0;font-size:11px;color:var(--text3);font-weight:500}
.add-form{display:flex;flex-direction:column;gap:6px;padding:0.2rem 0 0}
.add-form select{background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:12px;font-weight:600;padding:7px 10px;border-radius:8px;outline:none;cursor:pointer;width:100%}
.add-form select option{background:var(--bg2);color:var(--text)}
.btn-add{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px;font-size:13px;font-family:var(--font);cursor:pointer;font-weight:700;transition:all 0.15s;width:100%}
.btn-add:hover{opacity:0.88;transform:translateY(-1px)}
.nav-btn{width:100%;text-align:left;background:transparent;border:none;color:var(--text2);font-family:var(--font);font-size:13px;font-weight:600;padding:7px 10px;border-radius:var(--r);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:9px;min-height:36px}
.nav-btn:hover{background:var(--bg4);color:var(--text)}
.nav-btn.active{background:linear-gradient(135deg,#3B1F0E,#7B4A2D);color:#fff;box-shadow:0 8px 20px rgba(59,31,14,.22)}
.nav-btn .ni{font-size:15px;width:20px;text-align:center}
.sidebar-month-group{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.sidebar-month-heading{font-size:9px;font-weight:900;color:var(--text3);letter-spacing:.14em;text-transform:uppercase;padding:0 2px 3px}
.mpill{width:100%;text-align:left;background:rgba(255,255,255,.55);border:1px solid rgba(59,31,14,.08);color:var(--text3);font-family:var(--font);font-size:11px;font-weight:600;padding:7px 10px;border-radius:12px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mpill:hover{background:var(--bg4);color:var(--text2);transform:translateY(-1px)}
.mpill.active{background:linear-gradient(135deg,#3B1F0E,#7B4A2D);color:#fff;font-weight:700;box-shadow:0 10px 22px rgba(59,31,14,.22)}
.mpill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0.6;flex-shrink:0}
.mpill-month{white-space:nowrap;flex-shrink:0}
.month-card-pill{min-height:50px;padding:8px 10px;border-radius:14px;backdrop-filter:blur(14px)}
.mpill.active.current-month{background:linear-gradient(135deg,#3B1F0E 0%,#7B4A2D 56%,#B87942 100%);border-color:rgba(255,255,255,.22);box-shadow:0 16px 30px rgba(59,31,14,.26)}
.mpill-main{display:grid;grid-template-columns:minmax(0,1fr) max-content;align-items:center;gap:8px;width:100%}
.mpill-left,.mpill-right{display:flex;flex-direction:column;gap:3px;min-width:0}
.mpill-right{align-items:flex-end;text-align:right}
.mpill-title{font-size:12px;font-weight:800;line-height:1.1;color:inherit}
.mpill-sub{display:none}
.mpill-spent{font-size:11px;font-weight:800;font-family:var(--mono);color:var(--green)!important;line-height:1.1;white-space:nowrap}
.mpill.over:not(.active) .mpill-spent{color:var(--red)!important}
.mpill.under:not(.active) .mpill-spent{color:var(--green)!important}
.mpill.active .mpill-spent{color:#fff!important}
.mpill-net{display:none}
.year-group{border:1px solid rgba(59,31,14,.08);background:rgba(255,255,255,.38);border-radius:13px;overflow:hidden;margin-bottom:6px}
.year-toggle{width:100%;border:0;background:transparent;color:var(--text);font-family:var(--font);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:9px 10px;cursor:pointer}
.year-arrow{font-size:10px;color:var(--text3);transition:transform .18s ease}
.year-group.open .year-arrow{transform:rotate(90deg)}
.year-title{font-size:12px;font-weight:900;text-align:left}
.year-total{font-size:11px;font-weight:850;font-family:var(--mono);color:var(--text2)}
.year-months{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
.year-group.open .year-months{grid-template-rows:1fr}
.year-months-inner{overflow:hidden;padding:0 7px}
.year-months-inner .mpill{margin-bottom:6px}
.s-sync{font-size:10px;font-weight:600;color:var(--text3);display:flex;align-items:center;gap:5px}
.s-sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
.main{flex:1;padding:2rem 2.25rem 2.5rem;overflow-x:hidden;min-width:0}
.logo{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-0.5px;color:var(--text)}
.logo-sub{font-size:11px;font-weight:500;color:var(--text3);display:block;margin-top:2px}
.logo-icon{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sdiv{height:1px;background:var(--border);margin:0.4rem 0;flex-shrink:0}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding:0.75rem 1.1rem;background:rgba(255,252,247,.82);border:1px solid rgba(59,31,14,.1);border-radius:14px;gap:12px;flex-wrap:wrap;backdrop-filter:blur(16px);box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-greeting{font-size:13px;font-weight:700;color:var(--text)}
.tb-sub{font-size:11px;font-weight:500;color:var(--text3)}
.tb-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tb-clock{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.tb-time{font-size:18px;font-weight:800;font-family:var(--mono);color:var(--text);letter-spacing:-0.5px;line-height:1}
.tb-date{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:0.03em}
.tb-sync{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 10px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
.sync-txt{font-size:10px;font-weight:600;color:var(--text2)}
.sync-val{font-size:10px;font-weight:700;color:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.tracker-layout{display:flex;gap:1.5rem;align-items:flex-start}
.tracker-content{flex:1;min-width:0}
.txn-panel{width:var(--tw);flex-shrink:0;position:sticky;top:1rem}
.page-header{margin-bottom:1.75rem}
.page-title{font-size:28px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:10px;letter-spacing:-1px}
.page-sub{font-size:12.5px;color:#7A6B5E;margin-top:5px;font-weight:500}
.save-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:var(--gbg);padding:4px 10px;border-radius:20px;border:1px solid rgba(99,153,34,0.2);opacity:0;transition:opacity 0.3s;margin-left:12px;font-weight:700}
.save-badge.show{opacity:1}
.vtabs{display:flex;gap:4px;margin-bottom:1.75rem;background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:16px;padding:5px;width:fit-content;flex-wrap:wrap;backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.vtab{background:transparent;border:none;color:var(--text2);font-family:var(--font);font-size:13px;font-weight:700;padding:8px 16px;border-radius:12px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.vtab:hover{color:var(--text);background:var(--bg3)}
.vtab.active{background:linear-gradient(135deg,#3B1F0E,#7B4A2D);color:#fff;box-shadow:0 10px 24px rgba(59,31,14,.26)}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-bottom:1.55rem;align-items:stretch}
.scard{height:156px;background:#FFFFFF;border:1px solid rgba(231,221,209,.86);border-radius:22px;padding:18px 22px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(74,42,22,.055),0 1px 3px rgba(74,42,22,.035);display:flex;flex-direction:row;align-items:stretch;gap:14px;cursor:default}
.scard:hover{border-color:rgba(107,61,31,.18);transform:translateY(-2px);box-shadow:0 16px 30px rgba(74,42,22,.085),0 2px 6px rgba(74,42,22,.04)}
.scard:active{transform:translateY(-1px) scale(.998)}
.scard-top,.scard-mid{position:relative;z-index:1}
.scard-main{flex:1 1 60%;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:0}
.scard-side{flex:0 0 38%;display:flex;align-items:center;justify-content:flex-end;position:relative;z-index:1;min-width:0}
.scard-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;position:relative;z-index:1;margin-bottom:10px}
.scard-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}.scard-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;flex:0 1 auto}.scard-icon{width:42px;height:42px;flex:0 0 42px;border-radius:15px;background:#EFE7DD;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 7px 16px rgba(74,42,22,.07)}
.scard-title{min-width:0;flex:1 1 auto}
.scard-label{font-size:10px;color:#8A7B6B;font-weight:900;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard-badge{height:22px;width:max-content;max-width:fit-content;padding:0 8px;border-radius:999px;font-size:10px;font-weight:600;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:rgba(107,61,31,.08);color:#6B3D1F;display:inline-flex;align-items:center;justify-content:center;flex:0 1 auto}.scard-badge-compact,.scard-badge-dot{display:none}.scard-badge-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px currentColor;opacity:.75}
.scard-badge.success{background:rgba(34,197,94,.10);color:#22C55E}.scard-badge.warning{background:rgba(245,158,11,.10);color:#F59E0B}.scard-badge.danger{background:rgba(239,68,68,.10);color:#EF4444}.scard-badge.neutral{background:rgba(107,61,31,.08);color:#6B3D1F}
.scard-menu{width:27px;height:27px;flex:0 0 27px;border:1px solid rgba(231,221,209,.78);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8A7B6B;background:#FAF7F2;font-weight:900;font-size:14px}
.scard-mid{flex:1;min-height:0;padding:0;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.scard-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;position:relative;z-index:1;min-width:0}
.scard-val{font-size:29px;font-weight:900;font-family:var(--font);letter-spacing:0;color:#2B221B;line-height:1;white-space:nowrap}
.scard-val.green{color:#3BA55D}
.scard-val.red{color:#E25555}
.scard-sub{font-size:12px;color:#6B3D1F;margin-top:8px;font-weight:500;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard-sub .pos{color:#22C55E;font-weight:650}.scard-sub .neg{color:#EF4444;font-weight:650}.scard-sub .neu{color:#6B3D1F;font-weight:650}
.scard-spark{position:static;width:100%;max-width:160px;height:56px;display:block;overflow:visible;opacity:.85;z-index:1;pointer-events:none;flex:0 0 auto}
.scard-spark .area{stroke:none;opacity:1}
.scard-spark .line{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 7px 10px rgba(74,42,22,.07));transition:opacity .18s ease}
.scard-spark.available .line,.scard-spark.remaining .line{stroke:#22C55E}
.scard-spark.target .line{stroke:#3B82F6}
.scard-spark.spent .line{stroke:#EF4444}
.scard:hover .scard-spark .line{opacity:.92}
.scard.available,.scard.remaining{color:#3BA55D}
.scard.target{color:#B87942}
.scard.spent{color:#E25555}
.str{display:flex;align-items:center;gap:10px;margin-bottom:0.85rem;margin-top:1.5rem}
.str h3{font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.12em;white-space:nowrap}
.str::after{content:'';flex:1;height:1px;background:var(--border)}
.bal-section{background:#FFFFFF;border:1px solid #ECE8E1;border-radius:20px;padding:16px 20px;box-shadow:0 8px 30px rgba(0,0,0,.05);margin-bottom:18px}
.bal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
.bal-title-block{min-width:0}
.bal-title{font-size:14px;font-weight:900;color:var(--text);letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.bal-title-emoji{font-size:15px;line-height:1}
.bal-subtitle{font-size:11px;color:var(--text3);font-weight:600;margin-top:3px}
.bal-month-select{border:1px solid rgba(59,31,14,.1);background:#FBF7F2;color:var(--text);font-family:var(--font);font-weight:700;font-size:11px;border-radius:9px;padding:6px 10px;cursor:pointer;max-width:150px}
.bal-grid{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #F1EEE8}
.bal-row{display:grid;grid-template-columns:minmax(180px,1.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);align-items:stretch;min-height:42px;border-bottom:1px solid #F1EEE8;transition:background .18s ease}
.bal-row:last-child{border-bottom:0}
.bal-row:nth-of-type(even):not(.bal-row--head):not(.bal-row--sum){background:#FCFCFD}
.bal-row:not(.bal-row--head):not(.bal-row--sum):hover{background:#F5F9FF}
.bal-cell{display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--text);min-width:0}
.bal-cell.num{justify-content:flex-end}
.bal-cell.lbl{gap:10px}
.bal-row--head{min-height:46px;background:#F8FAFC;border-bottom:1px solid #ECEEF3}
.bal-row--head .bal-cell{padding:0 16px}
.bh-cell{gap:8px}
.bh-cell.hsbc{background:rgba(226,75,74,.06)}
.bh-cell.sbi{background:rgba(59,130,246,.06)}
.bh-cell.combined{background:rgba(34,160,90,.07)}
.bh-logo{width:26px;height:26px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.06);flex:0 0 26px;overflow:hidden}
.bh-logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.bh-logo-fallback{font-size:12px;font-weight:900;color:var(--text2)}
.bh-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.bh-name{font-size:12px;font-weight:800;color:var(--text);letter-spacing:0;line-height:1.1;font-family:var(--font)}
.bh-sub{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.bal-lbl-icon{width:26px;height:26px;border-radius:50%;background:#F5F1EA;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 26px}
.bal-lbl-text{min-width:0;font-size:12px;font-weight:650;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-num{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--text)}
.bc-num.green{color:#0E7C4A}
.bc-num.mute{color:var(--text3);font-weight:600}

.dash-card{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:22px;padding:1.15rem;box-shadow:var(--shadow-card);margin-bottom:1rem}
.dash-card-title{font-size:12px;font-weight:850;color:var(--text);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem}
.mini-stat{display:flex;align-items:center;gap:12px}
.mini-stat-icon{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px}
.mini-stat-val{font-size:22px;font-weight:850;font-family:var(--mono)}
.mini-stat-sub{font-size:12px;color:var(--text2);font-weight:650}
.settings-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:1.25rem}
.settings-tile{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:18px;padding:1rem;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-card)}
.settings-tile-icon,.section-icon,.alloc-icon{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.settings-tile-title,.section-heading{font-size:13px;font-weight:850}
.settings-tile-sub,.section-sub{font-size:11px;color:var(--text2);font-weight:650;margin-top:2px}
.settings-section{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:22px;box-shadow:var(--shadow-card);margin-bottom:1rem;overflow:hidden}
.settings-section-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.15rem;border-bottom:1px solid rgba(59,31,14,.07);gap:12px}
.section-title-row{display:flex;align-items:center;gap:12px}
.settings-section-body{padding:.85rem 1rem}
.quick-donut-wrap{display:flex;align-items:center;justify-content:center;padding:6px 0 14px}
.quick-donut{width:min(210px,100%);max-width:210px;aspect-ratio:1;border-radius:50%;margin:0 auto;position:relative;box-shadow:inset 0 0 0 1px rgba(59,31,14,.06),0 16px 32px rgba(59,31,14,.08)}
.quick-donut:after{content:attr(data-total) "\A Total Budget";white-space:pre;position:absolute;inset:30%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:850;color:var(--text);box-shadow:inset 0 0 0 1px rgba(59,31,14,.06);font-size:clamp(11px,1vw,14px);line-height:1.25;padding:8px}
.settings-legend{display:flex;flex-direction:column;gap:8px}
.insight-list{display:flex;flex-direction:column;gap:12px}
.insight{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--text2);font-weight:650}
.insight-bullet{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alloc-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:1rem}
.alloc-card{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:18px;padding:1rem;box-shadow:var(--shadow-card);min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.alloc-card-top{display:flex;align-items:center;gap:10px;min-width:0}
.alloc-name{font-size:12px;font-weight:850;line-height:1.2}
.alloc-pct{font-size:24px;font-weight:900;margin-top:5px;font-variant-numeric:tabular-nums}
.alloc-amt{font-size:13px;font-weight:800;font-family:var(--mono);margin-top:4px;white-space:nowrap}
.alloc-line{height:6px;border-radius:999px;background:rgba(59,31,14,.07);overflow:hidden;margin-top:0}
.alloc-line span{display:block;height:100%;border-radius:inherit;background:var(--sec-color)}
.alloc-card-bottom{display:grid;grid-template-columns:minmax(0,1fr) max-content max-content;align-items:center;gap:12px}
.settings-page{display:flex;flex-direction:column;gap:1.25rem;max-width:none;margin:0}
.settings-page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:.25rem}
.settings-overview{display:none}
.settings-top-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:1.1rem;align-items:stretch}
.settings-top-grid>.settings-section,.settings-top-grid>.dash-card{margin-bottom:0;height:100%}
.budget-panel{min-width:0}
.budget-panel .settings-section-body{padding:1rem 1.05rem}
.quick-overview-card{display:flex;flex-direction:column;justify-content:space-between;padding:16px;min-height:0}
.insights-card{display:none!important}
.category-workspace{margin-top:0}
.data-panel .settings-section-body{padding:1rem}
.btn-icon{background:transparent;border:1px solid var(--border2);color:var(--text2);font-size:11px;padding:7px 12px;border-radius:10px;cursor:pointer;transition:all 0.15s;font-weight:700;font-family:var(--font)}
.btn-icon:hover{background:var(--bg4);color:var(--text)}
.btn-icon.danger{border-color:rgba(226,75,74,0.3);color:var(--red)}
.btn-icon.danger:hover{background:var(--rbg)}
.btn-icon.primary{background:linear-gradient(135deg,#5C3420,#3B1F0E);color:#fff;border:none}
.btn-icon.primary:hover{opacity:0.88}
.archive-list{display:flex;flex-direction:column;gap:10px}
.archive-card{display:grid;grid-template-columns:minmax(160px,1.1fr) repeat(4,minmax(110px,.75fr)) max-content;gap:12px;align-items:center;background:#fff;border:1px solid rgba(59,31,14,.09);border-radius:16px;padding:13px 14px;box-shadow:0 4px 16px rgba(59,31,14,.05)}
.archive-card:hover{border-color:rgba(59,31,14,.16)}
.archive-title{font-size:14px;font-weight:900;color:var(--text)}
.archive-sub,.archive-label{font-size:9px;font-weight:850;color:var(--text3);text-transform:uppercase;letter-spacing:.09em}
.archive-value{font-family:var(--mono);font-size:12px;font-weight:850;color:var(--text)}
.archive-value.green{color:var(--green)}
.archive-value.red{color:var(--red)}
.archive-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.archive-empty{padding:18px;border:1px dashed rgba(59,31,14,.16);border-radius:16px;background:rgba(245,244,240,.58);font-size:12px;font-weight:700;color:var(--text2);text-align:center}
:root{--expense-grid:minmax(190px,2.2fr) minmax(112px,.82fr) minmax(112px,.9fr) minmax(112px,.9fr) minmax(120px,.9fr) minmax(112px,.82fr)}
.tracker-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,clamp(340px,24vw,390px));grid-auto-rows:auto;align-items:start;gap:1.5rem;width:100%;}
.tracker-content{min-width:0;min-height:0;height:auto;display:flex;flex-direction:column;}
.txn-panel{position:sticky;top:1rem;align-self:start;display:flex;width:auto;min-width:0;min-height:0;height:auto;overflow:hidden;}
.txn-wrap{flex:1 1 auto;width:100%;min-height:0;height:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:22px}
.txn-hdr,.txn-recent-strip,.txn-archive-tools,.txn-footer{flex:0 0 auto}
.txn-list{flex:1 1 auto;min-height:0;max-height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable}
.tracker-actions{display:flex;justify-content:flex-end;margin-top:0.5rem;padding-bottom:0.5rem;}
.dashboard-grid{display:grid;grid-template-columns:1fr;gap:1.25rem;align-items:start;margin-bottom:1.15rem}
.dashboard-left{display:flex;flex-direction:column;gap:1rem}
.dashboard-right{display:none}
.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.account-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,252,247,.68));border:1px solid rgba(59,31,14,.09);border-radius:20px;padding:13px 14px;box-shadow:var(--shadow-card);backdrop-filter:blur(16px);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.account-card:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(59,31,14,.1);border-color:rgba(59,31,14,.16)}
.account-logo{width:42px;height:42px;border-radius:15px;background:rgba(59,31,14,.06);border:1px solid rgba(59,31,14,.08);display:flex;align-items:center;justify-content:center;overflow:hidden}
.account-logo img{max-width:31px;max-height:22px;object-fit:contain}
.account-logo-fallback{font-size:20px}
.account-name{font-size:14px;font-weight:900;color:var(--text)}
.account-mask{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text2);margin-top:2px}
.account-type{font-size:11px;font-weight:700;color:var(--text3);margin-top:3px}
.account-status{justify-self:end;align-self:start;font-size:9px;font-weight:900;color:var(--green);background:rgba(99,153,34,.12);border:1px solid rgba(99,153,34,.22);padding:4px 8px;border-radius:999px}

/* ═══════════════════════════════════════════
   SAVINGS GOALS — COMPACT REDESIGN
   ═══════════════════════════════════════════ */

.savings-goals{display:flex;flex-direction:column;gap:16px;margin-top:0;width:100%}
.savings-goals-head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:28px;padding:0 24px}
.savings-title{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;line-height:1}
.fund-add-btn{border:0;background:#F1ECE5;color:#17110D;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 8px 20px rgba(59,31,14,.06);display:inline-flex;align-items:center;gap:6px;line-height:1}
.fund-add-btn:hover{background:#EAE2D8;transform:translateY(-1px)}
.fund-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* ── Fund Card Base ── */
.fund-card{
  position:relative;
  padding:14px 14px 0;
  border-radius:18px;
  border:1px solid var(--fund-border);
  background:var(--fund-bg);
  box-shadow:0 8px 28px rgba(31,24,16,.04);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  overflow:hidden;
  color:#0F0D0B;
  display:flex;
  flex-direction:column;
  min-height:220px;
}
.fund-card:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(31,24,16,.08);border-color:var(--fund-border-strong)}

/* ── Illustration ── */
.fund-card-bg{
  position:absolute;
  right:10px;
  top:44px;
  width:min(72px,18%);
  height:54px;
  pointer-events:none;
  z-index:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  opacity:.30;
}
.fund-card-bg svg{width:100%;height:100%;overflow:visible}
.fund-card-accent{display:none}

/* ── Inner layout: flex column ── */
.fund-card-inner{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  flex:1;
  gap:0;
}

/* ── Top Row ── */
.fund-card-top{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  height:32px;
  margin-bottom:10px;
}
.fund-card-title{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  flex:1;
}
.fund-logo{
  width:26px;height:26px;border-radius:999px;
  font-size:0;color:var(--fund-color);
  background:var(--fund-soft);border:1px solid var(--fund-border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.32);
}
.fund-logo svg{width:15px;height:15px;display:block}
.fund-name{
  font-size:13px;font-weight:900;color:#11100F;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.05;min-width:0;
}
.fund-card-tools{
  display:flex;align-items:center;gap:6px;
  flex-shrink:0;margin-left:auto;
}
.fund-active{
  font-size:8px;font-weight:950;color:var(--fund-color);
  background:var(--fund-soft);border:0;
  padding:3px 7px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;
}
.fund-status-badge{display:none}
.fund-menu-btn{
  width:24px;height:24px;border:0;border-radius:999px;
  background:transparent;color:#11100F;
  font-size:17px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:3;padding-bottom:4px;flex-shrink:0;
}
.fund-menu-btn:hover{background:rgba(59,31,14,.06)}

/* ── Middle Row: Ring + Amount + Illustration ── */
.fund-card-middle{
  display:flex;
  align-items:center;
  gap:12px;
  padding-right:80px; /* leave space for illustration */
  margin-bottom:12px;
  position:relative;
  z-index:2;
}

/* ── Ring ── */
.fund-ring-wrap{
  width:82px;height:82px;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  z-index:2;
}
.fund-ring-svg{
  position:absolute;inset:0;
  width:100%;height:100%;
  transform:rotate(-90deg);
}
.fund-ring-track{fill:none;stroke:var(--fund-ring-track);stroke-width:7}
.fund-ring-fill{
  fill:none;stroke-width:7;stroke-linecap:round;
  transition:stroke-dashoffset .4s ease;
}
.fund-ring-pct{
  font-size:14px;font-weight:950;font-family:var(--mono);
  letter-spacing:-.2px;position:relative;z-index:1;
  line-height:1;color:var(--fund-color);
}

/* ── Amount info ── */
.fund-card-mid{
  display:flex;flex-direction:column;
  justify-content:center;
  min-width:0;flex:1;
  position:relative;z-index:2;
}
.fund-card-amounts{display:block;min-width:0}
.fund-balance-line{
  display:flex;align-items:baseline;
  gap:0;margin-bottom:4px;
  flex-wrap:nowrap;min-width:0;
}
.fund-balance{
  font-family:var(--mono);font-size:24px;font-weight:950;
  color:#080706;line-height:1;letter-spacing:-.4px;white-space:nowrap;
}
.fund-inline-pct{display:none}
.fund-goal-line{
  font-size:10px;font-weight:820;color:#4E443B;
  white-space:normal;overflow:visible;line-height:1.3;
}
.fund-goal-line strong{color:#181513;font-weight:950}

/* ── Progress bar hidden ── */
.fund-progress{display:none}

/* ── Stats Panel (bottom, full-width) ── */
.fund-card-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  width:calc(100% + 28px); /* bleed to card edges */
  margin-left:-14px;
  margin-right:-14px;
  border-top:1px solid rgba(44,32,24,.08);
  background:rgba(255,255,255,.80);
  backdrop-filter:blur(8px);
  overflow:hidden;
  border-radius:0 0 17px 17px;
  flex-shrink:0;
}
.fund-stat-item{
  display:flex;flex-direction:column;
  justify-content:center;
  gap:3px;
  padding:10px 12px;
  border-right:1px solid rgba(44,32,24,.07);
}
.fund-stat-item:last-child{border-right:none}
.fund-stat-icon{display:none}
.fund-stat-label{
  font-size:9px;font-weight:700;color:var(--text3);
  white-space:nowrap;line-height:1.2;
  text-transform:uppercase;letter-spacing:.06em;
}
.fund-stat-value{
  font-size:11px;font-weight:800;color:#0D0B09;
  font-family:var(--mono);
  white-space:normal;overflow-wrap:anywhere;
  line-height:1.3;word-break:break-word;
}

/* ── Footer / misc hidden ── */
.fund-card-footer{display:none}
.fund-forecast{display:none}

/* View Details button */
.fund-view-btn{
  height:26px;
  border:1px solid rgba(59,31,14,.12);
  background:#F1EEE7;color:#11100F;
  font-family:var(--font);font-size:10px;font-weight:900;
  padding:0 11px;border-radius:999px;cursor:pointer;
  transition:all .15s ease;white-space:nowrap;
  box-shadow:0 4px 10px rgba(59,31,14,.07);flex-shrink:0;
}
.fund-view-btn:hover{background:#E9E2D8;box-shadow:0 6px 14px rgba(59,31,14,.12);transform:translateY(-1px)}

/* ── Theme colours ── */
.fund-card.travel{--fund-color:#3B82F6;--fund-soft:rgba(59,130,246,.10);--fund-border:rgba(59,130,246,.20);--fund-border-strong:rgba(59,130,246,.30);--fund-bg:linear-gradient(112deg,#F8FCFF 0%,#F1F8FF 72%,#FFFFFF 100%);--fund-ring-track:#DCEEFF}
.fund-card.emergency{--fund-color:#EF4444;--fund-soft:rgba(239,68,68,.10);--fund-border:rgba(239,68,68,.18);--fund-border-strong:rgba(239,68,68,.28);--fund-bg:linear-gradient(112deg,#FFF9F8 0%,#FFF1F0 72%,#FFFFFF 100%);--fund-ring-track:#FFE1E1}

/* Dropdown menu */
.fund-menu{position:absolute;right:10px;top:42px;width:188px;background:#fff;border:1px solid rgba(59,31,14,.1);border-radius:14px;box-shadow:0 18px 40px rgba(26,18,8,.16);padding:6px;z-index:20;}
.fund-menu button{width:100%;border:0;background:transparent;color:var(--text);font-family:var(--font);font-size:11px;font-weight:760;text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;}
.fund-menu button:hover{background:rgba(59,31,14,.06)}
.fund-menu button.danger{color:var(--red)}

/* Empty state */
.fund-empty{border:1px dashed rgba(59,31,14,.16);border-radius:16px;padding:14px;background:rgba(255,255,255,.48);font-size:12px;font-weight:750;color:var(--text2);}

/* Details modal */
.fund-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.fund-detail-stat{background:#fff;border:1px solid rgba(59,31,14,.08);border-radius:14px;padding:11px 12px;}
.fund-detail-stat span{display:block;font-size:9px;font-weight:900;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;}
.fund-detail-stat strong{display:block;margin-top:4px;font-family:var(--mono);font-size:14px;font-weight:900;color:var(--text);}
.fund-detail-stat strong.good{color:var(--green)}
.fund-detail-stat strong.warn{color:#EF9F27}
.fund-detail-stat strong.bad{color:var(--red)}
.fund-detail-forecast{background:linear-gradient(135deg,rgba(59,31,14,.04),rgba(59,31,14,.02));border:1px solid rgba(59,31,14,.08);border-radius:14px;padding:12px;margin-bottom:14px;font-size:12px;font-weight:700;color:var(--text2);font-style:italic;}

/* Theme selector */
.fund-theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.fund-theme-btn{border:1px solid rgba(59,31,14,.12);background:#fff;border-radius:12px;padding:8px 6px;font-family:var(--font);font-size:10px;font-weight:800;color:var(--text2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;transition:all .15s ease;text-align:center;}
.fund-theme-btn:hover{border-color:rgba(59,31,14,.25);background:rgba(59,31,14,.04);}
.fund-theme-btn.active{border-color:var(--choice-color,#378ADD);background:rgba(55,138,221,.10);color:var(--text);}
.fund-theme-btn .theme-icon{font-size:18px;line-height:1}
.fund-theme-btn .theme-name{font-size:9px;font-weight:800;letter-spacing:.03em}

/* Date field */
.fund-date-field{width:100%;background:rgba(255,255,255,.88);border:1px solid rgba(59,31,14,.14);border-radius:12px;padding:10px 12px;font-family:var(--font);font-size:13px;font-weight:700;color:var(--text);outline:none;transition:border-color .18s ease,box-shadow .18s ease;cursor:pointer;}
.fund-date-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,119,221,.12);}
.fund-date-field::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer;}

/* History list */
.fund-history-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto;padding-right:2px;}
.fund-history-row{display:grid;grid-template-columns:minmax(120px,1fr) max-content max-content;gap:10px;align-items:center;background:#fff;border:1px solid rgba(59,31,14,.08);border-radius:13px;padding:10px;}
.fund-history-kind{font-size:12px;font-weight:900;color:var(--text)}
.fund-history-date{font-size:10px;font-weight:700;color:var(--text3);margin-top:2px}
.fund-history-amt,.fund-history-bal{font-family:var(--mono);font-size:12px;font-weight:900;color:var(--text);text-align:right;white-space:nowrap;}
.fund-history-amt.deposit{color:var(--green)}
.fund-history-amt.redemption{color:var(--red)}

/* Fund settings rows */
.fund-settings-list{display:flex;flex-direction:column;gap:10px}
.fund-settings-row{display:grid;grid-template-columns:minmax(150px,1fr) max-content max-content;gap:10px;align-items:center;background:#fff;border:1px solid rgba(59,31,14,.08);border-radius:14px;padding:10px 12px}
.fund-settings-title{font-size:13px;font-weight:900;color:var(--text)}
.fund-settings-sub{font-size:10px;font-weight:700;color:var(--text3);margin-top:2px}

.icon-choice,.color-choice{border:1px solid rgba(59,31,14,.12);background:#fff;border-radius:12px;padding:8px 6px;font-family:var(--font);font-size:11px;font-weight:850;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;min-height:38px}
.icon-choice.active,.color-choice.active{border-color:var(--fund-color);background:var(--fund-soft);color:var(--text)}

/* alloc redesign */
.alloc-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:0;}
.alloc-card2{background:#fff;border:1px solid rgba(59,31,14,.09);border-radius:18px;padding:1.1rem 1.25rem 1rem;box-shadow:0 4px 16px rgba(59,31,14,.06);display:flex;flex-direction:column;gap:0;min-height:130px;justify-content:space-between;}
.alloc2-top{display:flex;align-items:center;gap:12px;margin-bottom:auto;padding-bottom:0.5rem;}

.alloc2-name{font-size:14px;font-weight:800;color:var(--text);line-height:1.2;}
.alloc2-bottom{display:flex;flex-direction:column;gap:6px;}
.alloc2-bar-wrap{width:100%;}

.alloc2-meta{display:flex;align-items:center;justify-content:flex-end;gap:10px;}
.alloc2-amt{font-size:12px;font-weight:700;color:var(--text2);font-family:var(--mono);}
.alloc2-pct{font-size:22px;font-weight:900;font-family:var(--font);letter-spacing:-0.5px;}

/* quick overview card */
.quick-overview-card2{background:#fff;border:1px solid rgba(59,31,14,.09);border-radius:22px;padding:1.25rem 1.25rem 1rem;box-shadow:0 4px 16px rgba(59,31,14,.06);display:flex;flex-direction:column;gap:0;height:100%;}

.qo2-total{font-size:13px;font-weight:900;color:var(--text);letter-spacing:-0.3px;line-height:1.2;}

.qo2-legend{display:flex;flex-direction:column;gap:8px;margin-top:auto;}
.ql-row{display:flex;align-items:center;gap:8px;}
.ql-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.ql-name{flex:1;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ql-amt{font-size:11px;font-weight:700;font-family:var(--mono);color:var(--text);white-space:nowrap;}
.ql-pct{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap;font-family:var(--mono);}
.settings-top-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.55fr);gap:1.1rem;align-items:stretch;}
.budget-panel .settings-section-body{padding:1rem;}

/* modals */
.modal-backdrop{position:fixed;inset:0;background:rgba(26,18,8,.36);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}
.modal-card{width:min(560px,100%);max-height:min(760px,92vh);overflow:auto;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,252,247,.9));border:1px solid rgba(59,31,14,.14);border-radius:22px;box-shadow:0 30px 80px rgba(26,18,8,.24)}

.modal-sub{font-size:11px;font-weight:700;color:var(--text2);margin-top:3px}
.modal-close{border:1px solid rgba(59,31,14,.12);background:#fff;color:var(--text2);width:32px;height:32px;border-radius:10px;cursor:pointer;font-weight:900}

.fund-modal-stat{background:#fff;border:1px solid rgba(59,31,14,.08);border-radius:14px;padding:11px}
.fund-modal-stat span{display:block;font-size:9px;font-weight:900;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.fund-modal-stat strong{display:block;margin-top:4px;font-family:var(--mono);font-size:13px;color:var(--text)}
.modal-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.modal-field label{font-size:10px;font-weight:900;color:var(--text2);text-transform:uppercase;letter-spacing:.08em}
.modal-field input,.modal-field select{width:100%;background:rgba(255,255,255,.88);border:1px solid rgba(59,31,14,.14);border-radius:12px;padding:10px 12px;font-family:var(--font);font-size:13px;font-weight:700;color:var(--text);outline:none}
.modal-field input[type=number]{font-family:var(--mono);text-align:right}
.modal-field input:focus,.modal-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
.modal-error{display:none;margin:8px 0 0;color:var(--red);font-size:12px;font-weight:800}
.modal-error.show{display:block}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.confirm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.confirm-item{background:#fff;border:1px solid rgba(59,31,14,.08);border-radius:12px;padding:10px}
.confirm-item span{display:block;font-size:9px;font-weight:900;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.confirm-item strong{display:block;margin-top:4px;font-size:13px;font-weight:850;color:var(--text);word-break:break-word}

/* global txn modal */
.tracker-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:1.25rem;flex-wrap:wrap;position:relative}.new-txn-btn{height:60px;min-width:238px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(105deg,#6B3D1F 0%,#8B5A35 100%);color:#fff;font-family:var(--font);font-weight:700;font-size:15px;border-radius:999px;padding:0 18px 0 8px;cursor:pointer;box-shadow:0 10px 25px rgba(107,61,31,.20);display:inline-flex;align-items:center;justify-content:space-between;gap:13px;position:relative;overflow:visible;isolation:isolate;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}.new-txn-btn:before{content:'';position:absolute;inset:1px 9px auto 20px;height:16px;border-radius:999px;background:linear-gradient(180deg,rgba(248,244,238,.34),rgba(248,244,238,0));pointer-events:none;z-index:0}.new-txn-btn:after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--ripple-x,50%) var(--ripple-y,50%),rgba(248,244,238,.42),rgba(248,244,238,0) 42%);opacity:0;transform:scale(.72);pointer-events:none}.new-txn-btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(107,61,31,.28);filter:saturate(1.03)}.new-txn-btn:active{transform:translateY(0) scale(.98);box-shadow:0 8px 20px rgba(107,61,31,.22)}.new-txn-btn:active:after{animation:newTxnRipple .34s ease}.new-txn-btn:focus-visible{outline:3px solid rgba(217,164,65,.62);outline-offset:4px}.new-txn-badge,.new-txn-label,.new-txn-arrow{position:relative;z-index:1}.new-txn-badge{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#F8F4EE,#EFE7DD);color:#6B3D1F;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900;line-height:1;box-shadow:0 7px 16px rgba(74,42,22,.20),inset 0 1px 0 rgba(255,255,255,.88);flex:0 0 auto}.new-txn-label{white-space:nowrap;letter-spacing:0}.new-txn-arrow{font-size:20px;font-weight:900;line-height:1;color:#F8F4EE;transition:transform .18s ease;flex:0 0 auto}.new-txn-btn:hover .new-txn-arrow{transform:translateX(4px)}.new-txn-spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#D9A441;box-shadow:0 0 0 3px rgba(217,164,65,.12);pointer-events:none;z-index:2}.new-txn-spark.s1{right:24px;top:-6px;animation:newTxnFloat 3.2s ease-in-out infinite}.new-txn-spark.s2{left:38px;bottom:-7px;width:4px;height:4px;opacity:.82;animation:newTxnFloat 3.7s ease-in-out .45s infinite}.new-txn-arc{position:absolute;right:15px;bottom:-9px;width:54px;height:22px;border-bottom:2px solid rgba(217,164,65,.58);border-radius:0 0 999px 999px;transform:rotate(-8deg);pointer-events:none}.txn-desc{font-size:10px;font-weight:650;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;max-width:138px}.gtxn-card-actions{display:flex;gap:5px;margin-top:7px;justify-content:flex-end}.gtxn-mini-btn{border:1px solid rgba(59,31,14,.12);background:#fff;color:var(--text2);border-radius:8px;font-family:var(--font);font-size:9px;font-weight:800;padding:4px 7px;cursor:pointer}.gtxn-mini-btn.danger{color:var(--red);border-color:rgba(226,75,74,.24)}@keyframes newTxnRipple{from{opacity:1;transform:scale(.58)}to{opacity:0;transform:scale(1.45)}}@keyframes newTxnFloat{0%,100%{transform:translateY(0);opacity:.68}50%{transform:translateY(-4px);opacity:1}}
.gtxn-backdrop{position:fixed;inset:0;background:rgba(43,34,27,.32);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;animation:modalFade .25s ease both}
.gtxn-modal{width:min(1400px,100%);max-height:min(92vh,900px);overflow:hidden;background:#FAF7F2;border:1px solid #E7DDD1;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.12);display:flex;flex-direction:column;animation:modalScale .25s ease both}
@keyframes modalFade{from{opacity:0}to{opacity:1}}@keyframes modalScale{from{transform:scale(.98)}to{transform:scale(1)}}
.gtxn-head{display:flex;justify-content:space-between;gap:18px;padding:22px 24px 14px}
.gtxn-title{font-size:24px;font-weight:900;color:#2B221B;letter-spacing:0}

.gtxn-close{width:38px;height:38px;border:1px solid #E7DDD1;border-radius:14px;background:#FFFFFF;color:#4A2A16;font-size:24px;cursor:pointer;transition:all .18s ease}

.gtxn-body{display:grid;grid-template-columns:260px minmax(440px,1fr) 320px;gap:20px;padding:10px 24px 24px;overflow:auto}
.gtxn-panel{background:#FFFFFF;border:1px solid #E7DDD1;border-radius:24px;padding:16px;min-width:0;box-shadow:0 14px 32px rgba(74,42,22,.055)}

.gtxn-section-btn{width:100%;min-height:78px;border:1px solid #E7DDD1;background:#FFFFFF;border-radius:20px;padding:14px;text-align:left;font-family:var(--font);cursor:pointer;color:#2B221B;display:flex;gap:12px;align-items:center;box-shadow:0 8px 18px rgba(74,42,22,.045);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}

.gtxn-illustration{position:absolute;right:20px;top:18px;width:92px;height:62px;border-radius:20px;background:linear-gradient(135deg,#EFE7DD,#FFFFFF);border:1px solid #E7DDD1;box-shadow:0 12px 24px rgba(74,42,22,.07);display:flex;align-items:center;justify-content:center;color:#B87942;font-size:28px}
.gtxn-illustration:before{content:'₹';position:absolute;left:13px;bottom:8px;width:24px;height:24px;border-radius:50%;background:#B87942;color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}
.gtxn-type-row{display:flex;gap:8px;margin:0 110px 18px 0}
.gtxn-type{border:1px solid #E7DDD1;background:#FFFFFF;color:#8A7B6B;border-radius:999px;padding:9px 13px;font-family:var(--font);font-weight:850;cursor:pointer;min-width:96px;transition:all .18s ease}
.gtxn-type.active{background:#6B3D1F;color:#fff;border-color:#6B3D1F;box-shadow:0 10px 20px rgba(107,61,31,.18)}
.gtxn-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gtxn-field{display:flex;flex-direction:column;gap:8px;position:relative}
.gtxn-field.full{grid-column:1/-1}
.gtxn-field label{font-size:10px;font-weight:900;color:#8A7B6B;letter-spacing:.09em;text-transform:uppercase}
.gtxn-field input,.gtxn-field select,.gtxn-field textarea{width:100%;border:1px solid #E7DDD1;background:#FFFFFF;color:#2B221B;font-family:var(--font);border-radius:18px;padding:15px 16px 15px 42px;outline:none;font-size:14px;font-weight:750;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}

.gtxn-live-preview{min-height:20px;margin-top:9px;font-size:12px;font-weight:750;color:#8A7B6B}

.gtxn-toggle input{appearance:none;width:42px;height:24px;border-radius:999px;border:1px solid #E7DDD1;background:#EFE7DD;padding:0;position:relative;transition:background .18s ease,border-color .18s ease}
.gtxn-toggle input:before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(74,42,22,.15);transition:transform .18s ease}
.gtxn-toggle input:checked{background:#6B3D1F;border-color:#6B3D1F}
.gtxn-toggle input:checked:before{transform:translateX(18px)}
.gtxn-summary{display:flex;flex-direction:column;gap:12px}
.gtxn-stat{background:#FFFFFF;border:1px solid #E7DDD1;border-radius:18px;padding:13px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}

/* responsive */

  .fund-card{min-height:180px;max-height:200px}
  .fund-card-inner{grid-template-columns:minmax(140px,180px) minmax(0,1fr)}
  .fund-card-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fund-stat-value{font-size:12px}
  .fund-stat-label{font-size:10px}
  .fund-stat-item{padding:8px 10px}
  .fund-ring-wrap{width:52px;height:52px}
  .fund-balance{font-size:24px}
  .fund-inline-pct{font-size:14px}
}

@media(max-width:1100px){
  .fund-card-inner{grid-template-columns:minmax(130px,160px) minmax(0,1fr)}
  .fund-card-stats{grid-template-columns:repeat(3,minmax(0,1fr))}

  .fund-stat-item{padding:6px 8px}

/* exp-card styles */
.exp-card{position:relative;padding:10px 14px 9px;border-left:4px solid var(--sec-color);background:linear-gradient(135deg,var(--sec-tint),rgba(255,255,255,.78) 54%,rgba(255,255,255,.62))}
.exp-top{display:grid;grid-template-columns:var(--expense-grid);gap:0;align-items:center}
.exp-identity{padding-right:18px;min-width:0;display:flex;align-items:center;gap:12px}
.exp-icon{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--sec-soft);box-shadow:inset 0 0 0 1px rgba(255,255,255,.65),0 10px 22px var(--sec-glow)}
.exp-title{font-size:15px;font-weight:850;letter-spacing:0;color:#16100A}
.exp-note{font-size:11px;font-weight:600;color:var(--text2);margin-top:2px}
.exp-metric{border-left:1px solid rgba(59,31,14,.09);padding:0 14px;text-align:right;min-width:0}
.exp-metric.spent-metric{grid-column:3/span 2;text-align:center}
.exp-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);margin-bottom:3px}
.exp-value{font-size:15px;font-weight:650;letter-spacing:0;color:#241A12}
.exp-value.good{color:var(--green)}
.exp-value.bad{color:var(--red)}
.exp-status{grid-column:6;justify-self:end;display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:850;border:1px solid;white-space:nowrap}
.exp-status:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.exp-status.ok{color:var(--green);background:rgba(99,153,34,.11);border-color:rgba(99,153,34,.2)}
.exp-status.warn{color:#EF9F27;background:rgba(239,159,39,.13);border-color:rgba(239,159,39,.24)}
.exp-status.critical{color:var(--red);background:rgba(226,75,74,.11);border-color:rgba(226,75,74,.22)}
.exp-progress-wrap{margin-top:7px}
.exp-progress-track{height:5px;border-radius:999px;background:var(--sec-track);overflow:hidden}
.exp-progress-fill{height:100%;width:min(var(--pct),100%);border-radius:inherit;background:var(--sec-color);box-shadow:0 0 16px var(--sec-glow);transition:width .25s ease}
.exp-progress-meta{display:flex;justify-content:space-between;gap:12px;margin-top:5px;font-size:10px;font-weight:700;color:var(--text2)}
.exp-progress-meta .bad{color:var(--red)}
.exp-progress-meta .good{color:var(--green)}
.exp-table-wrap{padding:6px 10px 10px;background:rgba(255,255,255,.62);border-top:1px solid rgba(59,31,14,.07);overflow-x:auto}

var FUND_THEME_FALLBACK='travel';
function getFundThemeKey(kind,f){
  f=f||getFund(kind);
  if(f.theme&&FUND_THEMES[f.theme]) return f.theme;
  if(kind&&FUND_THEMES[kind]) return kind;
  var keys=Object.keys(FUND_THEMES);
  for(var i=0;i<keys.length;i++){ if(kind&&kind.toLowerCase().indexOf(keys[i])>=0) return keys[i]; }
  var emoji=(f&&f.emoji)||'';
  for(var j=0;j<keys.length;j++){ if(FUND_THEMES[keys[j]].icon===emoji) return keys[j]; }
  return FUND_THEME_FALLBACK;
}
function getThemeDef(kind,f){ return FUND_THEMES[getFundThemeKey(kind,f)]||FUND_THEMES[FUND_THEME_FALLBACK]; }

function getMonthsRemaining(f){

  var now=new Date(),target=new Date(f.targetDate+'T00:00:00');

function getMonthlyRequired(f){

  if(!months||months<=0) return null;

function getFundStatusLabel(status){
  if(status==='overdue') return '\uD83D\uDD34 Overdue';
  if(status==='due-soon') return '\uD83D\uDFE1 Due Soon';
  if(status==='on-track') return '\uD83D\uDFE2 On Track';
  return '';
}
function getFundForecast(kind,f){
  var remaining=getFundRemaining(f),balance=cleanNumber(f.balance),goal=cleanNumber(f.goal);
  if(balance>=goal&&goal>0) return '\uD83C\uDF89 Goal reached!';
  var history=(f.history||[]),deposits=history.filter(function(h){ return h.type==='transfer'||h.type==='deposit'; }),monthlyRate=0;
  if(deposits.length>=2){
    var sorted=deposits.slice().sort(function(a,b){ return (a.timestamp||0)-(b.timestamp||0); });
    var firstTs=sorted[0].timestamp||0,lastTs=sorted[sorted.length-1].timestamp||Date.now();
    var spanMonths=Math.max(1,((lastTs-firstTs)/(1000*60*60*24*30.44)));
    var totalDeposited=deposits.reduce(function(sum,h){ return sum+cleanNumber(h.amount); },0);
    monthlyRate=totalDeposited/spanMonths;
  }
  var monthlyRequired=getMonthlyRequired(f);
  if(monthlyRequired!==null&&monthlyRate>0){
    if(monthlyRate>=monthlyRequired) return 'At current pace you\'ll reach this goal on time.';
    return 'Need '+fmtF(monthlyRequired)+'/mo to reach goal on time.';
  }
  if(monthlyRate>0&&remaining>0){
    var monthsToGoal=Math.ceil(remaining/monthlyRate),projected=new Date();
    projected.setMonth(projected.getMonth()+monthsToGoal);
    return 'At current pace: '+MN[projected.getMonth()].slice(0,3)+' '+projected.getFullYear()+'.';
  }
  if(monthlyRequired!==null) return 'Need '+fmtF(monthlyRequired)+'/mo to reach goal on time.';
  return 'Add a target date for a forecast.';
}
function formatTargetDate(dateStr){
  if(!dateStr) return '\uD83D\uDCC5 No Target Date';
  var d=new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '\uD83D\uDCC5 No Target Date';
  return '\uD83D\uDCC5 '+d.getDate()+' '+MN[d.getMonth()].slice(0,3)+' '+d.getFullYear();
}

function addTxnBalances(txns){
  var months=sortedKeys();
  function getFinalClosing(bank){
    if(!months.length) return 0;
    var balCache={};
    function getClosingForMonth(monthKey,b){
      var ck=monthKey+'_'+b; if(balCache[ck]!==undefined) return balCache[ck];
      var inc={}; try{ inc=ST[monthKey].income||{}; }catch(e){}
      var prevK=prevLedgerKey(monthKey);
      var obField=b==='hsbc'?'ob_hsbc':'ob_sbi',ob;
      if(hasManualValue(inc,obField)) ob=numField(inc,obField);
      else if(prevK&&ST[prevK]) ob=getClosingForMonth(prevK,b);
      else if(prevK) ob=getArchivedClosing(prevK,b);
      else ob=0;
      var salF=b==='hsbc'?'sal_hsbc':'sal_sbi',othF=b==='hsbc'?'oth_hsbc':'oth_sbi';
      var sal=numField(inc,salF),oth=numField(inc,othF),spent=0;
      getSecs().forEach(function(sec){ sec.rows.forEach(function(row){ if(isFundTransferRow(row.id)) spent+=getMonthTransfers(monthKey,FUND_ROWS[row.id],b); else spent+=getX(monthKey,row.id,b); }); });
      var red=getMonthRedemptions(monthKey,'travel',b)+getMonthRedemptions(monthKey,'emergency',b);
      var closing=ob+sal+oth+red-spent; balCache[ck]=closing; return closing;
    }
    return getClosingForMonth(months[months.length-1],bank);
  }
  var runningBal={hsbc:getFinalClosing('hsbc'),sbi:getFinalClosing('sbi')};
  return txns.map(function(tx){
    if(runningBal[tx.acc]===undefined) runningBal[tx.acc]=0;
    var bal=runningBal[tx.acc];
    if(tx.type==='expense'||tx.type==='transfer') runningBal[tx.acc]=bal+tx.amt;
    else runningBal[tx.acc]=bal-tx.amt;
    return Object.assign({},tx,{displayBal:bal});
  });
}

    secs.forEach(function(s){ if(s.id===sec) secObj=s; s.rows.forEach(function(r){ if(r.id===row) rowObj=r; }); });
    if(nextVal>0) upsertTransaction(cur,{id:txId(['expense',cur,row,acc]),type:'expense',transactionType:'Expense',name:rowObj?rowObj.name:row,emoji:rowObj?rowObj.emoji:'\uD83D\uDCB8',color:ROW_C[getRowIdx(row)],secId:sec,secColor:secObj?secObj.color:'#378ADD',acc:acc,amount:nextVal,amt:nextVal,source:acc,destination:'expense',rowId:row,timestamp:ST[cur].expenses[row][tsKey]||Date.now()});
    else removeTransaction(cur,txId(['expense',cur,row,acc]));
    recalcExp(sec,row); recalcBal(); renderPie(); renderTxns(); queueSave({month:cur,refreshTransactions:true});
  }
}
function recalcBal(){
  var t=calc(cur),TT=getTT();
  [['ob_hsbc','ob_sbi'],['sal_hsbc','sal_sbi'],['oth_hsbc','oth_sbi'],['red_travel_hsbc','red_travel_sbi'],['red_emergency_hsbc','red_emergency_sbi']].forEach(function(p){
    var hv=getInc(cur,p[0]),sv=getInc(cur,p[1]);
    var el=R('comb-'+p[0]); if(el) el.textContent=(hv+sv)>0?fmtF(hv+sv):'\u2014';
  });
  [['h-avail',t.hA],['s-avail',t.sA],['c-avail',t.totA],['h-spent',t.hSp],['s-spent',t.sSp],['c-spent',t.totSp]].forEach(function(f){ var el=R(f[0]); if(el) el.textContent=fmtF(f[1]); });
  var hc=R('h-close'),sc=R('s-close'),cc=R('c-close');
  if(hc){ hc.textContent=fmtF(t.hC); hc.className='bc-num'+(t.hC<0?' neg':''); }
  if(sc){ sc.textContent=fmtF(t.sC); sc.className='bc-num'+(t.sC<0?' neg':''); }
  if(cc){ cc.textContent=fmtF(t.hC+t.sC); cc.className='bc-num'+((t.hC+t.sC)<0?' neg':''); }
  var rem=TT-getKpiBudgetUsed(t);
  var kpi=R('kpi-cards');
  if(kpi) kpi.outerHTML=renderKpiCards(t,TT,rem,getSecs());
  renderGlobalHeader();
}
function recalcExp(secId,rowId){
  var secs=getSecs(),row=null;
  secs.forEach(function(s){ s.rows.forEach(function(r){ if(r.id===rowId) row=r; }); });
  if(!row) return;
  var kind=FUND_ROWS[rowId],hv=kind?getMonthTransfers(cur,kind,'hsbc'):getX(cur,rowId,'hsbc'),sv=kind?getMonthTransfers(cur,kind,'sbi'):getX(cur,rowId,'sbi'),tot=hv+sv,diff=tot-row.target;
  var tEl=R('tot-'+secId+'-'+rowId),dEl=R('diff-'+secId+'-'+rowId);
  var hI=document.querySelector('[data-row="'+rowId+'"][data-acc="hsbc"]');
  var sI=document.querySelector('[data-row="'+rowId+'"][data-acc="sbi"]');
  if(tEl) tEl.textContent=tot>0?fmtF(tot):'\u2014';
  if(hI) hI.classList.toggle('over',tot>row.target&&hv>0);
  if(sI) sI.classList.toggle('over',tot>row.target&&sv>0);
  if(dEl){ if(tot===0) dEl.innerHTML='<span class="bdg nt">\u2014</span>'; else if(diff>0) dEl.innerHTML='<span class="bdg ov">+'+fmtF(diff)+'</span>'; else dEl.innerHTML='<span class="bdg ok">'+fmtF(diff)+'</span>'; }
  var sec=null; secs.forEach(function(s){ if(s.id===secId) sec=s; });
  if(sec){
    var sA=0,sT=0;
    sec.rows.forEach(function(r){ if(!isFundTransferRow(r.id)) sA+=getX(cur,r.id,'hsbc')+getX(cur,r.id,'sbi'); });
    sT=getAllocationAmount(sec);
    var el=R('sa-'+secId); if(el){ el.textContent=fmtF(sA); el.className='exp-value'+(sA>sT?' bad':''); }
    var rem=sT-sA,pct=sT>0?Math.round((sA/sT)*100):0;
    var statusClass=pct<=100?'ok':pct<=130?'warn':'critical',statusText=pct<=100?'On Track':pct<=130?'Slightly Over':'Critical';
    var sr=R('sr-'+secId),sp=R('sp-'+secId),sm=R('sm-'+secId),ss=R('ss-'+secId),sf=R('sf-'+secId);
    if(sr){ sr.textContent=rem>=0?fmtF(rem):'-'+fmtF(Math.abs(rem)); sr.className='exp-value '+(rem>=0?'good':'bad'); }
    if(sp) sp.textContent=pct+'% of target';
    if(sm){ sm.textContent=rem>=0?fmtF(rem)+' left':'Over budget by '+fmtF(Math.abs(rem)); sm.className=rem>=0?'good':'bad'; }
    if(ss){ ss.textContent=statusText; ss.className='exp-status '+statusClass; }
    if(sf&&sf.closest('.exp-sec')) sf.closest('.exp-sec').style.setProperty('--pct',pct+'%');
  }
}

<script>
function monthKeyFromDate(dateStr){var d=dateStr?new Date(dateStr+'T00:00:00'):new Date();if(isNaN(d.getTime()))d=new Date();return MN[d.getMonth()]+'-'+d.getFullYear()}
function transactionTimestamp(dateStr,timeStr){var d=dateStr||new Date().toISOString().slice(0,10),t=timeStr||'00:00',dt=new Date(d+'T'+t);return isNaN(dt.getTime())?Date.now():dt.getTime()}
function splitTimestamp(ts){var d=ts?new Date(ts):new Date();if(isNaN(d.getTime()))d=new Date();return{date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}}

  if(!row) return '';

  ensureFunds();

  var hit='';
  allFundKinds(true).forEach(function(kind){
    var f=getFundDef(kind),label=String(f.label||kind).toLowerCase();
    if(!hit&&(rid===kind||rid===kind+'_fund'||rid.indexOf(kind+'_fund')>=0||nm.indexOf(label)>=0||(nm.indexOf('fund')>=0&&nm.indexOf(kind)>=0))) hit=kind;
  });
  return hit;
}
function getTxnById(key,id){try{var list=ST[key].transactions||[];for(var i=0;i<list.length;i++){if(list[i]&&list[i].id===id)return list[i]}}catch(e){}return null}
function findTxnLocation(id,key){var keys=key?[key]:sortedKeys();for(var k=0;k<keys.length;k++){var tx=getTxnById(keys[k],id);if(tx)return{key:keys[k],tx:tx}}return null}
function incomeFieldForType(txType,bank){return 'oth_'+bank}
function adjustStoredAmount(obj,field,delta){if(!obj)return;var next=cleanNumber(obj[field])+delta;if(Math.abs(next)<0.0001)delete obj[field];else obj[field]=Math.max(0,Math.round(next))}
function applyTransactionEffects(tx,sign){
  if(!tx)return;
  var key=tx.monthKey||tx.key||cur,amount=Math.round(cleanNumber(tx.amount||tx.amt));
  if(!key||amount<=0)return;
  ensureMonthData(key);
  var delta=amount*(sign||1),type=tx.type;
  if(type==='income'||type==='credit'){
    adjustStoredAmount(ST[key].income,tx.incomeField||incomeFieldForType(type,tx.acc||tx.bank||'hsbc'),delta);
  } else if(type==='transfer'){
    var kind=tx.destination||FUND_ROWS[tx.rowId];
    if(!kind)return;
    if(!ST[key].transfers[kind])ST[key].transfers[kind]={};
    adjustStoredAmount(ST[key].transfers[kind],tx.acc||tx.source||'hsbc',delta);
    rebuildFundStats();
  } else {
    var row=tx.rowId||tx.category;
    if(!row)return;
    if(!ST[key].expenses[row])ST[key].expenses[row]={};
    var acc=tx.acc||tx.bank||'hsbc';
    adjustStoredAmount(ST[key].expenses[row],acc,delta);
    if(sign>0)ST[key].expenses[row]['_ts_'+acc]=tx.timestamp||Date.now();
  }
}
function refreshAfterTransaction(key){

}

function getTransactionPreview(){

    +'<input id="gtxn-time" type="time" value="'+escAttr(s.time)+'" '+(s.useNow?'disabled':'')+' onchange="updateTransactionState(\'time\',this.value)"/></div>'
    +'<div class="gtxn-field full gtxn-note-field" data-icon="\u270E"><label for="gtxn-description">Description</label>'
    +'<textarea id="gtxn-description" maxlength="220" oninput="handleTransactionDescriptionInput(this)" placeholder="Add notes about this transaction...">'+escHtml(s.description||'')+'</textarea></div>'
    +'<div class="gtxn-field full"><label class="gtxn-toggle">'
    +'<input id="gtxn-use-now" type="checkbox" '+(s.useNow?'checked':'')+' onchange="updateTransactionState(\'useNow\',this.checked)"/> \u2713 Use current date &amp; time'
    +'</label></div>'
    +'</div>'
    +'<div class="gtxn-error" id="gtxn-error"></div>'
    +'<div class="gtxn-actions">'
    +'<button onclick="closeTransactionModal()">Cancel</button>'
    +'<button class="primary" onclick="saveGlobalTransaction()">Save Transaction \u2713</button>'
    +'</div>'
    +'</section>'
    +'<aside class="gtxn-panel"><div class="gtxn-panel-title">Summary</div>'
    +'<div class="gtxn-summary" id="gtxn-summary">'+buildTransactionSummaryHtml(s,p)+'</div>'
    +'</aside>'
    +'</div></div></div>';
}
function showTransactionError(msg){
  var el=R('gtxn-error');
  if(el){el.textContent=msg;el.classList.add('show')}
}
function saveGlobalTransaction(){
  var s=transactionModalState,p=getTransactionPreview();
  if(!s)return;
  var amount=Math.round(cleanNumber(s.amount));
  if(amount<=0){showTransactionError('Amount must be greater than zero.');return}
  if(!p.row&&s.type!=='income'){showTransactionError('Choose a category.');return}
  if(!s.bank){showTransactionError('Choose a bank account.');return}
  var key=monthKeyFromDate(s.date),ts=transactionTimestamp(s.date,s.time),type=s.type==='income'?'income':(p.isTransfer?'transfer':'expense');
  var existing=s.id?findTxnLocation(s.id,s.originalKey):null;
  if(existing){applyTransactionEffects(existing.tx,-1);removeTransaction(existing.key,existing.tx.id)}
  ensureMonthData(key);
  var sec=p.sec||{},row=p.row||{},id=s.id||('gts_'+Date.now()+'_'+Math.random().toString(36).slice(2,8));
  var tx={
    id:id,
    type:type,
    transactionType:type==='income'?'Income':(type==='transfer'?'Fund Transfer':'Expense'),
    name:type==='income'?'Income':(row.name||'Transaction'),
    description:(s.description||'').trim().slice(0,220),
    note:(s.description||'').trim().slice(0,220),
    emoji:type==='income'?'\uD83D\uDCB0':(row.emoji||'\uD83D\uDCB8'),
    color:sec.color||'#378ADD',
    secId:sec.id||'income',
    secColor:sec.color||'#378ADD',
    section:sec.title||'',
    category:row.name||'Income',
    rowId:row.id||'income',
    acc:s.bank,
    bank:s.bank,
    amount:amount,
    amt:amount,
    source:s.bank,
    destination:type==='transfer'?p.fundKind:(type==='income'?s.bank:'expense'),
    date:s.date,
    time:s.time,
    timestamp:ts,
    month:key.split('-')[0],
    year:key.split('-')[1],
    monthKey:key,
    incomeField:type==='income'?incomeFieldForType(type,s.bank):undefined
  };
  applyTransactionEffects(tx,1);
  upsertTransaction(key,tx);
  closeTransactionModal();
  refreshAfterTransaction(key);
}
function deleteGlobalTransaction(id,key){
  var loc=findTxnLocation(id,key);
  if(!loc)return;
  if(!confirm('Delete this transaction? Its financial impact will be reversed.'))return;
  applyTransactionEffects(loc.tx,-1);
  removeTransaction(loc.key,id);
  refreshAfterTransaction(loc.key);
}

loadState();
</script>
