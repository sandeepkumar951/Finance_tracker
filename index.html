<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💵 Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F5F4F0;--bg2:#FFFFFF;--bg3:#EEECEA;--bg4:#E0DDD9;--bg5:#D5D2CE;
  --border:rgba(59,31,14,0.08);--border2:rgba(59,31,14,0.15);
  --text:#1A1208;--text2:#6B5C4E;--text3:#A89888;
  --accent:#3B1F0E;--accent2:#5C3420;--aglow:rgba(59,31,14,0.08);
  --green:#639922;--gbg:rgba(99,153,34,0.08);
  --red:#E24B4A;--rbg:rgba(226,75,74,0.08);--blue:#378ADD;
  --r:12px;--rl:18px;
  --font:'Montserrat','Segoe UI',sans-serif;--mono:'JetBrains Mono',monospace;
  --sw:275px;--tw:300px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
body{min-height:100vh}

/* ── SHELL ── */
.shell{
  display:flex;
  align-items:stretch;
  min-height:100vh;
  height:auto;
}

/* ══════════════════════════════════════════
   SIDEBAR — single continuous vertical rail
   ══════════════════════════════════════════ */
.sidebar{
  position:sticky;
  top:0;
  width:var(--sw);
  height:100vh;
  min-height:100vh;
  max-height:100vh;
  align-self:flex-start;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  overflow-y:auto;          /* ← CHANGED: allow sidebar itself to scroll */
  overflow-x:hidden;
  scrollbar-width:thin;
  scrollbar-color:rgba(59,31,14,.20) transparent;
  background:rgba(238,236,234,.88);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(59,31,14,.10);
}

.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(59,31,14,.20);border-radius:999px}

/* ── Logo block ── */
.sidebar-logo{
  flex:0 0 auto;
  padding:1.1rem 1rem 0.85rem;
}

/* ── Views block ── */
.sidebar-views{
  flex:0 0 auto;
  padding:0 1rem 0.5rem;
}

/* ── Separator ── */
.s-sep{
  flex:0 0 auto;
  height:1px;
  background:var(--border);
  margin:0;
}

/* ── Spending Mix block ── */
.sidebar-spending{
  flex:0 0 auto;
  padding:0.6rem 1rem 0.5rem;
}

/* ── Add Month block ── */
.sidebar-add{
  flex:0 0 auto;
  padding:0.5rem 1rem 0.6rem;
}

/* ── Months label ── */
.sidebar-months-lbl{
  flex:0 0 auto;
  padding:0.5rem 1rem 0.25rem;
  font-size:9px;
  font-weight:800;
  color:var(--text3);
  letter-spacing:0.14em;
  text-transform:uppercase;
}

/* ── Months list — ONLY this section scrolls ── */
.sidebar-months{
  flex:0 0 auto;            /* ← CHANGED: don't stretch, let content define height */
  min-height:0;
  overflow-y:visible;       /* ← CHANGED: no inner scroll, outer sidebar scrolls */
  overflow-x:hidden;
  padding:0 1rem 0.75rem;
}

.sidebar-months::-webkit-scrollbar{width:4px}
.sidebar-months::-webkit-scrollbar-thumb{background:rgba(59,31,14,.18);border-radius:999px}
.sidebar-months-inner{padding-bottom:.5rem}

/* ── Footer ── */
.s-footer{
  flex:0 0 auto;
  padding:0.55rem 1rem 0.7rem;
  border-top:1px solid var(--border);
  background:rgba(238,236,234,.96);
  backdrop-filter:blur(14px);
  position:sticky;          /* ← ADD: sticks to bottom of sidebar scroll area */
  bottom:0;
  z-index:2;
}


/* ── Shared nav label (used inside views) ── */
.nav-lbl{
  font-size:9px;font-weight:800;color:var(--text3);
  letter-spacing:0.14em;text-transform:uppercase;
  padding:0.5rem 0 0.25rem;
}

/* ── Spending Mix — flush, no card ── */
.spie-wrap{
  /* no background, no border, no shadow — lives inside the rail */
}
.spie-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.55rem}
.spie-title{font-size:9px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:0.13em}
.spie-badge{font-size:8px;font-weight:700;color:var(--accent);background:var(--aglow);border:1px solid var(--border2);padding:2px 7px;border-radius:10px}
.spie-canvas-wrap{position:relative;width:100%;max-width:170px;margin:0 auto;aspect-ratio:1/1}
.spie-canvas-wrap canvas{width:100%!important;height:100%!important}
.spie-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:58%}
.spie-amt{font-size:15px;font-weight:800;font-family:var(--font);color:var(--text);letter-spacing:-0.8px;line-height:1.1}
.spie-lbl{font-size:8px;font-weight:600;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;margin-top:3px}
.spie-legend{display:flex;flex-direction:column;gap:5px;margin-top:0.65rem}
.spl-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.spl-left{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.spl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.spl-name{font-size:10px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spl-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.spl-val{font-size:10px;font-family:var(--mono);color:var(--text);font-weight:500}
.spl-pct{font-size:9px;font-family:var(--mono);color:var(--text3);background:var(--bg4);padding:1px 4px;border-radius:4px}
.spie-empty{text-align:center;padding:1rem 0;font-size:11px;color:var(--text3);font-weight:500}

/* ── Add Month form ── */
.add-form{display:flex;flex-direction:column;gap:6px;padding:0.2rem 0 0}
.add-form select{background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:12px;font-weight:600;padding:7px 10px;border-radius:8px;outline:none;cursor:pointer;width:100%}
.add-form select option{background:var(--bg2);color:var(--text)}
.btn-add{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px;font-size:13px;font-family:var(--font);cursor:pointer;font-weight:700;transition:all 0.15s;width:100%}
.btn-add:hover{opacity:0.88;transform:translateY(-1px)}

/* ── Nav buttons ── */
.nav-btn{width:100%;text-align:left;background:transparent;border:none;color:var(--text2);font-family:var(--font);font-size:13px;font-weight:600;padding:7px 10px;border-radius:var(--r);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:9px;min-height:36px}
.nav-btn:hover{background:var(--bg4);color:var(--text)}
.nav-btn.active{background:linear-gradient(135deg,#3B1F0E,#7B4A2D);color:#fff;box-shadow:0 8px 20px rgba(59,31,14,.22)}
.nav-btn .ni{font-size:15px;width:20px;text-align:center}

/* ── Month pills ── */
.sidebar-month-group{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.sidebar-month-heading{font-size:9px;font-weight:900;color:var(--text3);letter-spacing:.14em;text-transform:uppercase;padding:0 2px 3px}

.mpill{width:100%;text-align:left;background:rgba(255,255,255,.55);border:1px solid rgba(59,31,14,.08);color:var(--text3);font-family:var(--font);font-size:11px;font-weight:600;padding:7px 10px;border-radius:12px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mpill:hover{background:var(--bg4);color:var(--text2);transform:translateY(-1px)}
.mpill.active{background:linear-gradient(135deg,#3B1F0E,#7B4A2D);color:#fff;font-weight:700;box-shadow:0 10px 22px rgba(59,31,14,.22)}
.mpill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0.6;flex-shrink:0}
.mpill-month{white-space:nowrap;flex-shrink:0}

.month-card-pill{min-height:50px;padding:8px 10px;border-radius:14px;backdrop-filter:blur(14px)}
.mpill.active.current-month{background:linear-gradient(135deg,#3B1F0E 0%,#7B4A2D 56%,#B87942 100%);border-color:rgba(255,255,255,.22);box-shadow:0 16px 30px rgba(59,31,14,.26)}
.mpill-main{display:grid;grid-template-columns:minmax(0,1fr) max-content;align-items:center;gap:8px;width:100%}
.mpill-left,.mpill-right{display:flex;flex-direction:column;gap:3px;min-width:0}
.mpill-right{align-items:flex-end;text-align:right}
.mpill-title{font-size:12px;font-weight:800;line-height:1.1;color:inherit}
.mpill-sub{display:none}
.mpill-spent{font-size:11px;font-weight:800;font-family:var(--mono);color:var(--green)!important;line-height:1.1;white-space:nowrap}
.mpill.over:not(.active) .mpill-spent{color:var(--red)!important}
.mpill.under:not(.active) .mpill-spent{color:var(--green)!important}
.mpill.active .mpill-spent{color:#fff!important}
.mpill-net{display:none}

.year-group{border:1px solid rgba(59,31,14,.08);background:rgba(255,255,255,.38);border-radius:13px;overflow:hidden;margin-bottom:6px}
.year-toggle{width:100%;border:0;background:transparent;color:var(--text);font-family:var(--font);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:9px 10px;cursor:pointer}
.year-arrow{font-size:10px;color:var(--text3);transition:transform .18s ease}
.year-group.open .year-arrow{transform:rotate(90deg)}
.year-title{font-size:12px;font-weight:900;text-align:left}
.year-total{font-size:11px;font-weight:850;font-family:var(--mono);color:var(--text2)}
.year-months{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
.year-group.open .year-months{grid-template-rows:1fr}
.year-months-inner{overflow:hidden;padding:0 7px}
.year-months-inner .mpill{margin-bottom:6px}

/* ── Sync footer ── */
.s-sync{font-size:10px;font-weight:600;color:var(--text3);display:flex;align-items:center;gap:5px}
.s-sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}

/* ════════════════════════════
   MAIN CONTENT
   ════════════════════════════ */
.main{flex:1;padding:2rem 2.25rem 2.5rem;overflow-x:hidden;min-width:0}

.logo{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-0.5px;color:var(--text)}
.logo-sub{font-size:11px;font-weight:500;color:var(--text3);display:block;margin-top:2px}
.logo-icon{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

.sdiv{height:1px;background:var(--border);margin:0.4rem 0;flex-shrink:0}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding:0.75rem 1.1rem;background:rgba(255,252,247,.82);border:1px solid rgba(59,31,14,.1);border-radius:14px;gap:12px;flex-wrap:wrap;backdrop-filter:blur(16px);box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-greeting{font-size:13px;font-weight:700;color:var(--text)}
.tb-sub{font-size:11px;font-weight:500;color:var(--text3)}
.tb-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tb-clock{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.tb-time{font-size:18px;font-weight:800;font-family:var(--mono);color:var(--text);letter-spacing:-0.5px;line-height:1}
.tb-date{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:0.03em}
.tb-sync{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 10px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
.sync-txt{font-size:10px;font-weight:600;color:var(--text2)}
.sync-val{font-size:10px;font-weight:700;color:var(--green)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.tracker-layout{display:flex;gap:1.5rem;align-items:flex-start}
.tracker-content{flex:1;min-width:0}
.txn-panel{width:var(--tw);flex-shrink:0;position:sticky;top:1rem}

.page-header{margin-bottom:1.75rem}
.page-title{font-size:28px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:10px;letter-spacing:-1px}
.page-sub{font-size:12.5px;color:#7A6B5E;margin-top:5px;font-weight:500}

.save-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:var(--gbg);padding:4px 10px;border-radius:20px;border:1px solid rgba(99,153,34,0.2);opacity:0;transition:opacity 0.3s;margin-left:12px;font-weight:700}
.save-badge.show{opacity:1}

.vtabs{display:flex;gap:4px;margin-bottom:1.75rem;background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:16px;padding:5px;width:fit-content;flex-wrap:wrap;backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.vtab{background:transparent;border:none;color:var(--text2);font-family:var(--font);font-size:13px;font-weight:700;padding:8px 16px;border-radius:12px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.vtab:hover{color:var(--text);background:var(--bg3)}
.vtab.active{background:linear-gradient(135deg,#3B1F0E,#7B4A2D);color:#fff;box-shadow:0 10px 24px rgba(59,31,14,.26)}

.scards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin-bottom:2rem}
.scard{background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,252,247,.76));border:1px solid rgba(59,31,14,.09);border-radius:20px;padding:1rem;backdrop-filter:blur(14px);transition:all 0.2s;position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.scard:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 16px 34px rgba(59,31,14,.10)}
.scard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);opacity:0;transition:opacity 0.2s}
.scard:hover::before{opacity:1}
.scard-icon{width:38px;height:38px;border-radius:13px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}
.scard-label{font-size:9px;color:var(--text3);font-weight:800;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px}
.scard-val{font-size:22px;font-weight:800;font-family:var(--font);letter-spacing:-0.5px;color:var(--text)}
.scard-val.green{color:var(--green)}
.scard-val.red{color:var(--red)}
.scard-val.blue{color:var(--blue)}
.scard-sub{font-size:11px;color:var(--text3);margin-top:4px;font-weight:500}

.str{display:flex;align-items:center;gap:10px;margin-bottom:0.85rem;margin-top:1.5rem}
.str h3{font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.12em;white-space:nowrap}
.str::after{content:'';flex:1;height:1px;background:var(--border)}

.bal-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:1px;background:var(--border);border-radius:var(--rl);overflow:hidden;border:1px solid var(--border);margin-bottom:0.5rem;box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.bh{background:var(--bg3);padding:10px 14px;display:flex;align-items:center;gap:8px}
.bh-logo{width:30px;height:20px;object-fit:contain;border-radius:3px;flex-shrink:0}
.bh-text{display:flex;flex-direction:column;gap:1px}
.bh-name{font-size:13px;font-weight:800;color:var(--text);letter-spacing:0.02em;font-family:var(--font)}
.bh-sub{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase}
.bc{background:var(--bg2);padding:9px 14px;font-size:13px;color:var(--text)}
.bc.lbl{color:var(--text2);font-size:12px;display:flex;align-items:center;gap:6px;font-weight:600}
.bc.mono{font-family:var(--mono);font-size:12px;color:var(--text2)}
.bc.tot{background:var(--bg3);font-family:var(--mono);font-size:13px;font-weight:700}
.bc.clos{background:var(--bg4);font-family:var(--mono);font-weight:800;font-size:13px}
.bc.clos.pos{color:var(--green)}
.bc.clos.neg{color:var(--red)}
.bc.auto{color:var(--green);font-family:var(--mono);font-size:12px}
.atag{font-size:9px;background:var(--gbg);color:var(--green);border-radius:4px;padding:1px 5px;font-weight:800;margin-left:4px}
.bi{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:12px;width:100%;padding:0}
.bi:focus{color:var(--blue)}
.bi::placeholder{color:var(--text3)}

.exp-sec{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,252,247,.76));border:1px solid rgba(59,31,14,.09);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06);transition:border-color .18s ease}
.exp-sec:hover{border-color:rgba(59,31,14,.16)}
.exp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.ehl{display:flex;align-items:center;gap:10px}
.eht{font-size:13px;font-weight:700;color:var(--text)}
.ehn{font-size:11px;color:var(--text3);margin-left:4px;font-weight:500}
.ehr{font-size:11px;color:var(--text2);display:flex;gap:14px;align-items:center;font-weight:600}
.ehr .ov{color:var(--red)}

table.et{width:100%;border-collapse:separate;border-spacing:0;display:block;min-width:880px}
table.et thead,table.et tbody{display:block;width:100%}
table.et tr{display:grid;grid-template-columns:var(--expense-grid,minmax(260px,2.5fr) minmax(120px,1fr) minmax(120px,1fr) minmax(120px,1fr) minmax(140px,1fr) minmax(120px,1fr));width:100%}
table.et th,table.et td{display:flex;align-items:center;min-width:0}
table.et th{font-size:9px;font-weight:800;color:var(--text3);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);background:rgba(238,236,234,.72);letter-spacing:0.08em;text-transform:uppercase;vertical-align:middle}
table.et th.r{text-align:right;justify-content:flex-end}
table.et td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
table.et tr:last-child td{border-bottom:none}
table.et tr:hover td{background:rgba(245,244,240,.8)}
table.et td.r{text-align:right;justify-content:flex-end}
table.et td.mn{font-family:var(--mono);font-size:12px;color:var(--text2)}
table.et td.tt{font-family:var(--mono);font-size:12px;font-weight:700}

.eth-bank{display:flex;align-items:center;justify-content:flex-end;gap:6px;width:100%}
.eth-bank-logo{width:24px;height:15px;object-fit:contain;border-radius:2px;flex-shrink:0}
.eth-bank-name{font-size:12px;font-weight:800;color:var(--text);font-family:var(--font);letter-spacing:0.04em}
.cn{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.cn span:last-child{overflow:hidden;text-overflow:ellipsis}
.ce{font-size:16px;width:22px;text-align:center}
.ei{background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--text);font-family:var(--mono);font-size:12px;width:100%;text-align:right;padding:2px 4px;border-radius:6px;transition:all 0.15s;min-height:28px}
.ei:focus{background:#fff;color:var(--blue);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
.ei::placeholder{color:var(--text3)}
.ei.over{color:var(--red);background:var(--rbg)}
.bdg{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:5px;font-weight:700}
.bdg.ok{color:var(--green);background:var(--gbg)}
.bdg.ov{color:var(--red);background:var(--rbg)}
.bdg.nt{color:var(--text3)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem;margin-bottom:1.25rem}

.btn-del{background:transparent;border:1px solid rgba(226,75,74,0.3);color:var(--red);font-family:var(--font);font-size:12px;font-weight:700;padding:6px 14px;border-radius:10px;cursor:pointer;transition:all 0.15s;margin-top:1.25rem}

.set-sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:1.25rem;box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}

.ti{background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--text);font-family:var(--mono);font-size:13px;width:120px;padding:7px 10px;border-radius:8px;text-align:right;transition:border-color 0.15s}

.reset-btn{background:transparent;border:1px solid var(--border2);color:var(--text2);font-family:var(--font);font-size:12px;font-weight:700;padding:5px 12px;border-radius:10px;cursor:pointer;transition:all 0.15s;margin-top:0.5rem}

.budget-inp{background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--green);font-family:var(--mono);font-size:18px;font-weight:800;width:160px;padding:8px 12px;border-radius:10px;text-align:right;transition:border-color 0.15s}

.blr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.blr:last-child{border-bottom:none}

.blr-info{flex:1}
.blr-name{font-size:13px;font-weight:700;color:var(--text)}
.blr-hint{font-size:11px;color:var(--text3);font-weight:500;margin-top:2px}
.blr-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--accent);font-family:var(--font);font-size:11px;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.blr-btn:hover{background:var(--bg4)}
.blr-file{display:none}

.empty{text-align:center;padding:5rem 2rem;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:1rem;display:block}
.empty h3{font-size:20px;font-weight:800;margin-bottom:0.5rem;color:var(--text)}
.empty p{font-size:13px;color:var(--text3);font-weight:500}

.cat-manager{margin-bottom:1.5rem}
.cat-sec-box{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:20px;box-shadow:0 10px 28px rgba(59,31,14,.06);overflow:hidden;margin-bottom:1rem}
.cat-sec-hdr{width:100%;border:none;border-bottom:1px solid rgba(59,31,14,.07);background:rgba(245,244,240,.72);display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(140px,.7fr) max-content;align-items:center;gap:18px;padding:14px 16px;text-align:left;font-family:var(--font);cursor:pointer}
.cat-sec-title{display:flex;align-items:center;gap:12px;min-width:0}
.cat-title-main{display:block;font-size:14px;font-weight:900;color:var(--text);line-height:1.15}
.cat-sec-progress{min-width:120px}
.cat-sec-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:max-content}
.cat-pct-badge{font-family:var(--mono);font-size:11px;font-weight:900;color:var(--sec-color);background:#fff;border:1px solid rgba(59,31,14,.08);border-radius:999px;padding:6px 9px}
.cat-toggle{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid rgba(59,31,14,.08);color:var(--text2);transition:transform .18s ease}

.cat-sec-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease,opacity .18s ease;opacity:1}

.cat-sec-body>*{overflow:hidden}
.cat-empty{padding:16px;font-size:12px;color:var(--text3);font-style:italic}
.cat-row{display:grid;grid-template-columns:minmax(220px,1.15fr) minmax(160px,.8fr) max-content;align-items:center;gap:18px;min-height:68px;padding:13px 16px;border-bottom:1px solid rgba(59,31,14,.07)}
.cat-row:last-child{border-bottom:none}
.cat-row:hover{background:rgba(245,244,240,.62)}
.cat-row-info{display:flex;align-items:center;gap:12px;min-width:0}
.cat-row-emoji{width:34px;height:34px;border-radius:12px;background:rgba(59,31,14,.05);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.cat-row-name{display:block;font-size:13px;font-weight:850;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row-sub{display:none}
.cat-row-progress{min-width:140px;display:grid;grid-template-columns:minmax(120px,1fr) max-content max-content;align-items:center;gap:12px}
.cat-row-bar{width:100%;height:7px;border-radius:999px;background:rgba(59,31,14,.08);overflow:hidden}
.cat-row-fill{display:block;height:100%;border-radius:inherit;background:var(--row-color)}
.cat-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.target-edit-input{width:104px;height:36px;text-align:right;font-family:var(--mono);font-size:12px;font-weight:850;border-radius:10px;padding:7px 10px;background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--green)}
.target-edit-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(127,119,221,.12)}
.add-cat-form{margin:0 16px 16px;border-radius:14px;border:1px solid rgba(59,31,14,.08);background:rgba(245,244,240,.72);padding:14px 16px;display:none}
.add-cat-form.show{display:block}
.add-cat-grid{display:grid;grid-template-columns:60px 1fr 130px;gap:8px;margin-bottom:10px}
.add-cat-input{background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--text);font-family:var(--font);font-size:12px;padding:8px 10px;border-radius:8px;font-weight:600;width:100%}
.add-cat-input:focus{border-color:var(--accent)}
.add-cat-input::placeholder{color:var(--text3)}
.add-cat-input.emoji-field{text-align:center;font-size:16px}
.add-cat-input.target-field{font-family:var(--mono);text-align:right}

.add-sec-form{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rl);padding:16px;display:none;margin-bottom:1rem}
.add-sec-form.show{display:block}
.add-sec-grid{display:grid;grid-template-columns:60px 1fr 1fr 80px;gap:8px;margin-bottom:10px}
.color-input{width:100%;height:38px;border:1px solid var(--border2);border-radius:8px;cursor:pointer;padding:2px;background:var(--bg2)}
.form-label{font-size:10px;font-weight:800;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.1em;display:block}

/* ── TRANSACTION PANEL ── */
.txn-wrap{
  flex:0 0 auto;
  width:100%;
  min-height:0;
  height:auto;              /* stays auto */

  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:22px;
  border-color:rgba(59,31,14,.09);
  background:linear-gradient(180deg,#fff 0%,rgba(255,252,247,.9) 100%);
}

.txn-hdr{padding:10px 13px 9px;background:linear-gradient(135deg,#3B1F0E 0%,#6B3A22 100%);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.txn-hdr-left{display:flex;align-items:center;gap:8px}
.txn-hdr-icon{width:28px;height:28px;background:rgba(255,255,255,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.txn-hdr-title{font-size:10px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:0.14em;line-height:1.2}
.txn-hdr-sub{font-size:8px;font-weight:500;color:rgba(255,255,255,0.55);letter-spacing:0.03em;margin-top:1px}
.txn-hdr-count{font-size:11px;font-weight:800;background:#fff;color:#3B1F0E;padding:2px 9px;border-radius:16px;flex-shrink:0}
.txn-recent-strip{display:flex;align-items:center;gap:6px;padding:6px 13px;background:#FFF8EE;border-bottom:1px solid rgba(232,160,32,0.15);flex-shrink:0}
.txn-recent-left{display:flex;align-items:center;gap:5px;flex-shrink:0}
.txn-recent-icon{font-size:11px;line-height:1}
.txn-recent-label{font-size:8px;font-weight:800;color:#E8A020;text-transform:uppercase;letter-spacing:0.10em}
.txn-recent-center{flex:1;font-size:9px;font-weight:700;color:#5C3C1E;font-family:var(--mono);text-align:center}
.txn-recent-pill{background:#EDE9E4;color:#A89888;font-size:8px;font-weight:700;padding:2px 8px;border-radius:16px;flex-shrink:0;font-family:var(--mono)}
.txn-list{overflow-y:auto;flex:1;padding:3px 8px 10px;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;background:#F7F6F2}
.txn-list::-webkit-scrollbar{width:3px}
.txn-list::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.txn-date-group{display:flex;align-items:center;gap:6px;padding:8px 2px 4px}
.txn-date-group-label{font-size:8px;font-weight:800;color:#B0A090;text-transform:uppercase;letter-spacing:0.13em;white-space:nowrap}
.txn-date-group-line{flex:1;height:1px;background:rgba(59,31,14,0.07)}
.txn-card{display:flex;align-items:stretch;background:#FFFFFF;border:1px solid rgba(59,31,14,0.06);border-radius:11px;margin-bottom:6px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,0.045);transition:box-shadow 0.15s,transform 0.15s;cursor:default}
.txn-card:hover{box-shadow:0 3px 12px rgba(0,0,0,0.08);transform:translateY(-1px)}
.txn-card:last-child{margin-bottom:0}
.txn-strip{width:3px;flex-shrink:0}
.txn-icon-col{padding:10px 8px 10px 9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.txn-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#F5F4F0}
.txn-info{flex:1;min-width:0;padding:9px 6px 9px 2px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.txn-name{font-size:12px;font-weight:700;color:#1A1208;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.txn-meta{display:flex;align-items:center;gap:4px}
.txn-month{font-size:9px;font-weight:600;color:#A89888;white-space:nowrap}
.txn-bank-chip{display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:4px;font-size:8px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;line-height:1.5;flex-shrink:0}
.txn-bank-chip.hsbc{background:#FEE2E2;color:#DC2626}
.txn-bank-chip.sbi{background:#DBEAFE;color:#1D6ED8}
.txn-bank-chip-logo{width:14px;height:9px;object-fit:contain;border-radius:1px;flex-shrink:0}
.txn-datetime{display:flex;align-items:center;gap:3px;font-size:8px;font-weight:600;color:#C4B5A5;font-family:var(--mono);line-height:1}
.txn-datetime-icon{font-size:9px}
.txn-right{padding:9px 11px 9px 4px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;flex-shrink:0;min-width:100px}
.txn-amt-row{display:flex;align-items:center;gap:3px}
.txn-amt{font-size:13px;font-weight:800;font-family:var(--mono);color:#1A1208;letter-spacing:-0.3px;white-space:nowrap}
.txn-arrow{font-size:11px;font-weight:900;line-height:1;flex-shrink:0}
.txn-arrow.debit{color:#E24B4A}
.txn-arrow.credit{color:#639922}
.txn-ago-pill{background:#F0EDE8;color:#A89888;font-size:8px;font-weight:700;padding:1px 7px;border-radius:16px;font-family:var(--mono);white-space:nowrap}
.txn-bal-label{font-size:7px;font-weight:800;color:#C4B5A5;text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap;margin-top:1px}
.txn-bal-val{font-size:10px;font-weight:700;font-family:var(--mono);color:#6B5C4E;white-space:nowrap;letter-spacing:-0.1px}
.txn-empty{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:11px;font-weight:500}
.txn-empty-icon{font-size:28px;display:block;margin-bottom:8px}
.txn-footer{padding:10px 2px 0}
.txn-view-all{width:100%;border:1px solid rgba(59,31,14,.12);background:rgba(255,255,255,.7);color:var(--accent);font-family:var(--font);font-size:12px;font-weight:900;border-radius:999px;padding:10px 12px;cursor:pointer;transition:all .16s ease}
.txn-view-all:hover{background:#fff;transform:translateY(-1px);box-shadow:0 10px 24px rgba(59,31,14,.08)}
.txn-archive-tools{display:flex;flex-direction:column;gap:8px;padding:10px 0}
.txn-filter{width:100%;border:1px solid rgba(59,31,14,.12);background:#fff;color:var(--text);font-family:var(--font);font-size:12px;font-weight:700;border-radius:12px;padding:9px 10px}
.txn-filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── Settings ── */
:root{--shadow-soft:0 18px 45px rgba(59,31,14,.08),0 2px 8px rgba(59,31,14,.05);--shadow-card:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.settings-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,320px);gap:1.5rem;align-items:start}
.dash-card{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:22px;padding:1.15rem;box-shadow:var(--shadow-card);margin-bottom:1rem}
.dash-card-title{font-size:12px;font-weight:850;color:var(--text);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem}
.mini-stat{display:flex;align-items:center;gap:12px}
.mini-stat-icon{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px}
.mini-stat-val{font-size:22px;font-weight:850;font-family:var(--mono)}
.mini-stat-sub{font-size:12px;color:var(--text2);font-weight:650}

.settings-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:1.25rem}
.settings-tile{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:18px;padding:1rem;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-card)}
.settings-tile-icon,.section-icon,.alloc-icon{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.settings-tile-title,.section-heading{font-size:13px;font-weight:850}
.settings-tile-sub,.section-sub{font-size:11px;color:var(--text2);font-weight:650;margin-top:2px}
.settings-section{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:22px;box-shadow:var(--shadow-card);margin-bottom:1rem;overflow:hidden}
.settings-section-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.15rem;border-bottom:1px solid rgba(59,31,14,.07);gap:12px}
.section-title-row{display:flex;align-items:center;gap:12px}
.settings-section-body{padding:.85rem 1rem}

.quick-donut-wrap{display:flex;align-items:center;justify-content:center;padding:6px 0 14px}
.quick-donut{width:min(210px,100%);max-width:210px;aspect-ratio:1;border-radius:50%;margin:0 auto;position:relative;box-shadow:inset 0 0 0 1px rgba(59,31,14,.06),0 16px 32px rgba(59,31,14,.08)}
.quick-donut:after{content:attr(data-total) "\A Total Budget";white-space:pre;position:absolute;inset:30%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:850;color:var(--text);box-shadow:inset 0 0 0 1px rgba(59,31,14,.06);font-size:clamp(11px,1vw,14px);line-height:1.25;padding:8px}
.settings-legend{display:flex;flex-direction:column;gap:8px}
.insight-list{display:flex;flex-direction:column;gap:12px}
.insight{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--text2);font-weight:650}
.insight-bullet{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.alloc-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:1rem}
.alloc-card{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:18px;padding:1rem;box-shadow:var(--shadow-card);min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.alloc-card-top{display:flex;align-items:center;gap:10px;min-width:0}
.alloc-name{font-size:12px;font-weight:850;line-height:1.2}
.alloc-pct{font-size:24px;font-weight:900;margin-top:5px;font-variant-numeric:tabular-nums}
.alloc-amt{font-size:13px;font-weight:800;font-family:var(--mono);margin-top:4px;white-space:nowrap}
.alloc-line{height:6px;border-radius:999px;background:rgba(59,31,14,.07);overflow:hidden;margin-top:0}
.alloc-line span{display:block;height:100%;border-radius:inherit;background:var(--sec-color)}
.alloc-card-bottom{display:grid;grid-template-columns:minmax(0,1fr) max-content max-content;align-items:center;gap:12px}

.settings-page{display:flex;flex-direction:column;gap:1.25rem;max-width:none;margin:0}
.settings-page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:.25rem}
.settings-overview{display:none}
.settings-top-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:1.1rem;align-items:stretch}
.settings-top-grid>.settings-section,.settings-top-grid>.dash-card{margin-bottom:0;height:100%}
.budget-panel{min-width:0}
.budget-panel .settings-section-body{padding:1rem 1.05rem}
.quick-overview-card{display:flex;flex-direction:column;justify-content:space-between;padding:16px;min-height:0}
.insights-card{display:none!important}
.category-workspace{margin-top:0}
.data-panel .settings-section-body{padding:1rem}

.btn-icon{background:transparent;border:1px solid var(--border2);color:var(--text2);font-size:11px;padding:7px 12px;border-radius:10px;cursor:pointer;transition:all 0.15s;font-weight:700;font-family:var(--font)}
.btn-icon:hover{background:var(--bg4);color:var(--text)}
.btn-icon.danger{border-color:rgba(226,75,74,0.3);color:var(--red)}

.btn-icon.primary{background:linear-gradient(135deg,#5C3420,#3B1F0E);color:#fff;border:none}

:root{--expense-grid:minmax(260px,2.5fr) minmax(120px,1fr) minmax(120px,1fr) minmax(120px,1fr) minmax(140px,1fr) minmax(120px,1fr)}
.tracker-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(320px,clamp(340px,24vw,390px));
  grid-auto-rows:auto;
  align-items:start;        /* ← CHANGED: was stretch, now start */
  gap:1.5rem;
  width:100%;
}

.tracker-content{
  min-width:0;
  min-height:0;
  height:auto;              /* ← ADD */
  display:flex;
  flex-direction:column;
}

.txn-panel{

  var n=Math.abs(v);
  var s=n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (v<0?'-':'')+'\u20B9'+s;
}
function fmtTimestamp(ts){
  if(!ts) return '';
  var d=new Date(ts);
  return String(d.getDate()).padStart(2,'0')+' '+MN[d.getMonth()].slice(0,3)+' '+d.getFullYear()+' \u2022 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function tsAgo(ts){
  if(!ts) return '';
  var d=Math.floor((Date.now()-ts)/1000);
  if(d<60) return d+'s ago';
  if(d<3600) return Math.floor(d/60)+'m ago';
  if(d<86400) return Math.floor(d/3600)+'h ago';
  return Math.floor(d/86400)+'d ago';
}
function getSecs(){
  var base=customSecs?customSecs:DEF_SECS;
  return base.map(function(s){
    return Object.assign({},s,{
      id:String(s.id||'').replace(/[^a-z0-9_:-]/gi,'_'),
      title:String(s.title||''),
      icon:String(s.icon||''),
      note:String(s.note||''),
      color:safeColor(s.color),
      rows:s.rows.map(function(r){
        return Object.assign({},r,{
          id:String(r.id||'').replace(/[^a-z0-9_:-]/gi,'_'),
          name:String(r.name||''),
          emoji:String(r.emoji||''),
          target:cTargets[r.id]!==undefined?cTargets[r.id]:r.target
        });
      })
    });
  });
}
function normalizeBudget(value){
  var n=Math.max(0,parseFloat(value)||0);
  return n>10000000?32000:n;
}
function getSectionBudgetTotal(sec){
  return Math.round(sec.rows.reduce(function(a,r){ return a+(parseFloat(r.target)||0); },0));
}
function getLiveBudgetTotal(secs){
  secs=secs||getSecs();
  var total=secs.reduce(function(a,sec){ return a+getSectionBudgetTotal(sec); },0);
  return total>0?total:normalizeBudget(mBudget);
}
function getTT(){ return getLiveBudgetTotal(); }
function getAllocationAmount(sec){ return getSectionBudgetTotal(sec); }
function getAllocationPct(sec,total){
  total=total||getLiveBudgetTotal();
  return total>0?Math.round((getAllocationAmount(sec)/total)*100):0;
}
function getBudgetMixStyle(secs){
  secs=secs||getSecs();
  var total=getLiveBudgetTotal(secs),start=0,stops=[];
  secs.forEach(function(sec){
    var pct=total>0?(getAllocationAmount(sec)/total)*100:0;
    var end=start+pct;
    stops.push(safeColor(sec.color)+' '+start.toFixed(2)+'% '+end.toFixed(2)+'%');
    start=end;
  });
  return stops.length?'conic-gradient('+stops.join(',')+')'  :'conic-gradient(#EEECEA 0 100%)';
}
function getMonthIncome(key){ var t=calc(key); return t.hSal+t.sSal+t.hOth+t.sOth; }
function getMonthProfitLoss(key){ var t=calc(key); return getMonthIncome(key)-t.totSp; }
function sortedKeys(){
  return Object.keys(ST).sort(function(a,b){
    var ap=a.split('-'),bp=b.split('-');
    var ay=parseInt(ap[1]),by=parseInt(bp[1]);
    if(ay!==by) return ay-by;
    return MN.indexOf(ap[0])-MN.indexOf(bp[0]);
  });
}
function prevKey(key){
  var m=sortedKeys(),i=m.indexOf(key);
  return i>0?m[i-1]:null;
}
function getX(key,rid,acc){
  try{
    if(typeof acc==='string'&&acc.indexOf('_ts_')===0) return 0;
    var val=ST[key].expenses[rid][acc];
    if(val===null||val===undefined) return 0;
    if(typeof val==='object') return 0;
    return parseFloat(val)||0;
  }catch(e){ return 0; }
}
function calcD(key){
  var S=getSecs(),inc=(ST[key]&&ST[key].income)?ST[key].income:{};
  var prev=prevKey(key),pT=prev?calcD(prev):null;
  var hOB=parseFloat(inc.ob_hsbc)||(pT?pT.hC:0);
  var sOB=parseFloat(inc.ob_sbi)||(pT?pT.sC:0);
  var hSal=parseFloat(inc.sal_hsbc)||0;
  var sSal=parseFloat(inc.sal_sbi)||0;
  var hOth=parseFloat(inc.oth_hsbc)||0;
  var sOth=parseFloat(inc.oth_sbi)||0;
  var hSp=0,sSp=0;
  S.forEach(function(s){ s.rows.forEach(function(r){ hSp+=getX(key,r.id,'hsbc'); sSp+=getX(key,r.id,'sbi'); }); });
  var hA=hOB+hSal+hOth,sA=sOB+sSal+sOth;
  return {hOB:hOB,sOB:sOB,hSal:hSal,sSal:sSal,hOth:hOth,sOth:sOth,hA:hA,sA:sA,hSp:hSp,sSp:sSp,hC:hA-hSp,sC:sA-sSp,totA:hA+sA,totSp:hSp+sSp};
}
function calc(key){ return calcD(key); }
function getInc(key,field){
  var v=0;
  try{ v=parseFloat(ST[key].income[field])||0; }catch(e){}
  if((field==='ob_hsbc'||field==='ob_sbi')&&!v){
    var p=prevKey(key);
    if(p){ var t=calcD(p); return field==='ob_hsbc'?t.hC:t.sC; }
  }
  return v;
}
function save(){
  var now=Date.now();
  lastSaveTimestamp=now;
  var payload={state:ST,cTargets:cTargets,mBudget:mBudget,logos:LOGOS,customSecs:customSecs,updatedAt:now};
  var ref=db.collection("trackers").doc("finance");
  ref.get().then(function(snap){
    var remoteUpdated=snap.exists&&snap.data().updatedAt?snap.data().updatedAt:null;
    if(remoteChangedWhileEditing||(remoteUpdated&&lastRemoteUpdatedAt&&remoteUpdated>lastRemoteUpdatedAt)){
      throw new Error("Remote data changed while you were editing. Reloaded latest data instead of overwriting it.");
    }
    return ref.set(payload);
  })
  .then(function(){
    lastSave=now; lastRemoteUpdatedAt=now; remoteChangedWhileEditing=false;
    updateSync();
    var b=R('sbadge'); if(b){ b.classList.add('show'); setTimeout(function(){ b.classList.remove('show'); },2000); }
  })
  .catch(function(err){
    console.error("Firebase save error:",err);
    var st=R('s-sync-txt'); if(st) st.textContent=err.message&&err.message.indexOf('Remote data changed')===0?'⚠️ Remote change detected. Reload before saving.':'⚠️ Firebase save failed';
  });
}
function queueSave(opts){
  opts=opts||{};
  var editedMonth=opts.month||cur;
  clearTimeout(debT);
  debT=setTimeout(function(){
    if(opts.refreshTransactions&&cur===editedMonth){
      scheduleUiRefresh(function(){ renderPills(); renderTxns(); });
    }
    save();
  },opts.delay||800);
}
function scheduleUiRefresh(fn){
  if(pendingUiRefresh) cancelAnimationFrame(pendingUiRefresh);
  pendingUiRefresh=requestAnimationFrame(function(){ pendingUiRefresh=null; fn(); });
}
function bindAppEvents(){
  if(appEventsBound) return;
  var app=R('app'); if(!app) return;
  app.addEventListener('input',function(e){ handleInput(e); handleSettingsInput(e); });
  appEventsBound=true;
}
function applyData(p){
  ST=p.state||{}; cTargets=p.cTargets||{}; mBudget=p.mBudget!==undefined?normalizeBudget(p.mBudget):32000;
  customSecs=p.customSecs||null;
  if(p.logos){ LOGOS.hsbc=p.logos.hsbc||LOGOS.hsbc; LOGOS.sbi=p.logos.sbi||LOGOS.sbi; }
  if(p.updatedAt){ lastSave=p.updatedAt; lastSaveTimestamp=p.updatedAt; lastRemoteUpdatedAt=p.updatedAt; }
}
function loadState(){
  initSelects(); startClock(); bindAppEvents();
  var bootMs=sortedKeys(); if(bootMs.length) cur=bootMs[bootMs.length-1];
  renderAll();
  var syncTxt=R('s-sync-txt'); if(syncTxt) syncTxt.textContent='🔄 Syncing...';
  if(financeUnsubscribe) financeUnsubscribe();
  financeUnsubscribe=db.collection("trackers").doc("finance").onSnapshot(function(doc){
    if(doc.exists){
      var p=doc.data();
      var editingNumber=isNumericEditing();
      if(editingNumber){
        if(p.updatedAt&&lastRemoteUpdatedAt&&p.updatedAt>lastRemoteUpdatedAt) remoteChangedWhileEditing=true;
        var stEdit=R('s-sync-txt'); if(stEdit) stEdit.textContent=remoteChangedWhileEditing?'⚠️ Remote edit waiting':'Editing locally';
        return;
      }
      applyData(p); remoteChangedWhileEditing=false; updateSync();
      var ms=sortedKeys(); if(ms.length&&(!cur||!ST[cur])) cur=ms[ms.length-1];
      renderAll();
      var st=R('s-sync-txt'); if(st) st.textContent='🔥 Firebase synced';
    } else {
      var st=R('s-sync-txt'); if(st) st.textContent='🔥 Firebase ready';
      renderAll();
    }
  },function(err){ console.error("Firebase error:",err); var st=R('s-sync-txt'); if(st) st.textContent='⚠️ Offline mode'; });
}
function updateSync(){
  var el1=R('sync-val'),el2=R('s-sync-txt');
  if(!lastSave){ if(el1) el1.textContent='not yet'; return; }
  var d=Math.floor((Date.now()-lastSave)/1000);
  var txt=d<10?'just now':d<60?d+'s ago':d<3600?Math.floor(d/60)+'m ago':Math.floor(d/3600)+'h ago';
  if(el1) el1.textContent=txt;
  if(el2) el2.textContent='🔥 Synced '+txt;
}
function startClock(){
  function tick(){
    var now=new Date();
    var h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0'),s=String(now.getSeconds()).padStart(2,'0');
    var te=R('tb-time'); if(te) te.textContent=h+':'+m+':'+s;
    var de=R('tb-date'); if(de) de.textContent=DN[now.getDay()]+', '+now.getDate()+' '+MN[now.getMonth()].slice(0,3)+' '+now.getFullYear();
    var hr=now.getHours(),gr=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
    var ge=R('tb-greeting'); if(ge) ge.textContent=gr+'!';
    updateSync();
  }
  tick(); setInterval(tick,1000);
}
function initSelects(){
  var nowMonth=new Date().getMonth(),nowYear=new Date().getFullYear();
  var ms=R('sel-month');
  if(ms){ ms.innerHTML=''; for(var mi=0;mi<12;mi++){ var mo=document.createElement('option'); mo.value=MN[mi]; mo.textContent=MN[mi]; if(mi===nowMonth) mo.selected=true; ms.appendChild(mo); } }
  var ys=R('sel-year');
  if(ys){ ys.innerHTML=''; for(var yr=2050;yr>=2024;yr--){ var yo=document.createElement('option'); yo.value=String(yr); yo.textContent=String(yr); if(yr===nowYear) yo.selected=true; ys.appendChild(yo); } }
}
function addMonth(){
  var ms=R('sel-month'),ys=R('sel-year'); if(!ms||!ys) return;
  var m=ms.value,y=ys.value; if(!m||!y) return;
  var key=m+'-'+y; if(!ST[key]) ST[key]={income:{},expenses:{}};
  cur=key; save(); renderAll();
}
function delMonth(){
  if(!cur||!ST[cur]){ alert('Select a month before deleting.'); return; }
  if(!confirm('Delete '+cur+'?')) return;
  delete ST[cur]; save();
  var ms=sortedKeys(); cur=ms.length?ms[ms.length-1]:null; renderAll();
}

<script>

function renderPie(){

}
function getRowIdx(rowId){ var idx=0,found=false; getSecs().forEach(function(sec){ sec.rows.forEach(function(row){ if(!found){ if(row.id===rowId) found=true; else idx++; } }); }); return idx; }
function getTxns(limit){
  var txns=[],secs=getSecs(),months=sortedKeys();
  months.forEach(function(k){
    var parts=k.split('-'),monthName=parts[0],year=parts[1],monthIdx=MN.indexOf(monthName);
    var inc={}; try{ inc=ST[k].income||{}; }catch(e){}
    ['hsbc','sbi'].forEach(function(acc){
      var obField=acc==='hsbc'?'ob_hsbc':'ob_sbi',salField=acc==='hsbc'?'sal_hsbc':'sal_sbi',othField=acc==='hsbc'?'oth_hsbc':'oth_sbi';
      var obVal=parseFloat(inc[obField])||0,salVal=parseFloat(inc[salField])||0,othVal=parseFloat(inc[othField])||0;
      var baseTs=new Date(parseInt(year),monthIdx,1).getTime();
      if(obVal>0) txns.push({name:'Opening Balance',emoji:'🏦',color:'#378ADD',secId:'income',secColor:'#378ADD',acc:acc,amt:obVal,type:'credit',month:monthName,year:year,ts:baseTs+1,key:k,rowId:'ob_'+acc});
      if(salVal>0) txns.push({name:'Salary',emoji:'💰',color:'#1D9E75',secId:'income',secColor:'#1D9E75',acc:acc,amt:salVal,type:'credit',month:monthName,year:year,ts:baseTs+2,key:k,rowId:'sal_'+acc});
      if(othVal>0) txns.push({name:'Other Income',emoji:'➕',color:'#06B6D4',secId:'income',secColor:'#06B6D4',acc:acc,amt:othVal,type:'credit',month:monthName,year:year,ts:baseTs+3,key:k,rowId:'oth_'+acc});
    });
    secs.forEach(function(sec){ sec.rows.forEach(function(row){ ['hsbc','sbi'].forEach(function(acc){ var v=getX(k,row.id,acc); if(v>0){ var txTs=0; try{ txTs=ST[k].expenses[row.id]['_ts_'+acc]||0; }catch(e){} txns.push({name:row.name,emoji:row.emoji,color:ROW_C[getRowIdx(row.id)],secId:sec.id,secColor:sec.color,acc:acc,amt:v,type:'debit',month:monthName,year:year,ts:txTs,key:k,rowId:row.id}); } }); }); });
  });

function renderTxns(){

  var months=sortedKeys();

      var ck=monthKey+'_'+b; if(balCache[ck]!==undefined) return balCache[ck];

      else if(prevK) ob=getClosingForMonth(prevK,b);

    });
  });

function setView(v){

function handleInput(e){

function recalcBal(){
  var t=calc(cur),TT=getTT();
  [['ob_hsbc','ob_sbi'],['sal_hsbc','sal_sbi'],['oth_hsbc','oth_sbi']].forEach(function(p){
    var hv=getInc(cur,p[0]),sv=getInc(cur,p[1]);
    var el=R('comb-'+p[0]); if(el) el.textContent=(hv+sv)>0?fmtF(hv+sv):'—';
  });
  [['h-avail',t.hA],['s-avail',t.sA],['c-avail',t.totA],['h-spent',t.hSp],['s-spent',t.sSp],['c-spent',t.totSp]].forEach(function(f){ var el=R(f[0]); if(el) el.textContent=fmtF(f[1]); });
  var hc=R('h-close'),sc=R('s-close'),cc=R('c-close');
  if(hc){ hc.textContent=fmtF(t.hC); hc.className='bc clos '+(t.hC>=0?'pos':'neg'); }
  if(sc){ sc.textContent=fmtF(t.sC); sc.className='bc clos '+(t.sC>=0?'pos':'neg'); }
  if(cc){ cc.textContent=fmtF(t.hC+t.sC); cc.className='bc clos '+((t.hC+t.sC)>=0?'pos':'neg'); }
  var cards=document.querySelectorAll('.scard-val');
  if(cards[0]) cards[0].textContent=fmtF(t.totA);
  if(cards[2]){ cards[2].textContent=fmtF(t.totSp); cards[2].className='scard-val'+(t.totSp>TT?' red':''); }
  var rem=TT-t.totSp;
  if(cards[3]){ cards[3].textContent=fmtF(Math.abs(rem)); cards[3].className='scard-val'+(rem>=0?' green':' red'); }

function recalcExp(secId,rowId){
  var secs=getSecs(),row=null;
  secs.forEach(function(s){ s.rows.forEach(function(r){ if(r.id===rowId) row=r; }); });
  if(!row) return;
  var hv=getX(cur,rowId,'hsbc'),sv=getX(cur,rowId,'sbi'),tot=hv+sv,diff=tot-row.target;
  var tEl=R('tot-'+secId+'-'+rowId),dEl=R('diff-'+secId+'-'+rowId);
  var hI=document.querySelector('[data-row="'+rowId+'"][data-acc="hsbc"]');
  var sI=document.querySelector('[data-row="'+rowId+'"][data-acc="sbi"]');
  if(tEl) tEl.textContent=tot>0?fmtF(tot):'—';
  if(hI) hI.classList.toggle('over',tot>row.target&&hv>0);
  if(sI) sI.classList.toggle('over',tot>row.target&&sv>0);
  if(dEl){ if(tot===0) dEl.innerHTML='<span class="bdg nt">—</span>'; else if(diff>0) dEl.innerHTML='<span class="bdg ov">+'+fmtF(diff)+'</span>'; else dEl.innerHTML='<span class="bdg ok">'+fmtF(diff)+'</span>'; }
  var sec=null; secs.forEach(function(s){ if(s.id===secId) sec=s; });
  if(sec){
    var sA=0,sT=0;
    sec.rows.forEach(function(r){ sA+=getX(cur,r.id,'hsbc')+getX(cur,r.id,'sbi'); });
    sT=getAllocationAmount(sec);
    var el=R('sa-'+secId); if(el){ el.textContent=fmtF(sA); el.className='exp-value'+(sA>sT?' bad':''); }
    var rem=sT-sA,pct=sT>0?Math.round((sA/sT)*100):0;
    var statusClass=pct<=100?'ok':pct<=130?'warn':'critical',statusText=pct<=100?'On Track':pct<=130?'Slightly Over':'Critical';
    var sr=R('sr-'+secId),sp=R('sp-'+secId),sm=R('sm-'+secId),ss=R('ss-'+secId),sf=R('sf-'+secId);
    if(sr){ sr.textContent=rem>=0?fmtF(rem):'-'+fmtF(Math.abs(rem)); sr.className='exp-value '+(rem>=0?'good':'bad'); }
    if(sp) sp.textContent=pct+'% of target';
    if(sm){ sm.textContent=rem>=0?fmtF(rem)+' left':'Over budget by '+fmtF(Math.abs(rem)); sm.className=rem>=0?'good':'bad'; }
    if(ss){ ss.textContent=statusText; ss.className='exp-status '+statusClass; }
    if(sf&&sf.closest('.exp-sec')) sf.closest('.exp-sec').style.setProperty('--pct',pct+'%');
  }
}

function updateCategoryManagerMetrics(secs){
  var total=getLiveBudgetTotal(secs);
  document.querySelectorAll('.cat-sec-box').forEach(function(box,secIdx){
    var sec=secs[secIdx]; if(!sec) return;
    var secTotal=getAllocationAmount(sec),pct=getAllocationPct(sec,total);
    var sub=box.querySelector('.cat-sec-title .section-sub'); if(sub) sub.textContent=fmtF(secTotal)+' / '+fmtF(total);
    var badge=box.querySelector('.cat-pct-badge'); if(badge) badge.textContent=pct+'%';
    var headFill=box.querySelector('.cat-sec-progress .cat-row-fill'); if(headFill) headFill.style.width=pct+'%';
    box.querySelectorAll('.cat-row').forEach(function(rowEl,rowIdx){
      var row=sec.rows[rowIdx]; if(!row) return;
      var rowPct=secTotal?Math.min(100,Math.round(((parseFloat(row.target)||0)/secTotal)*100)):0;
      var fill=rowEl.querySelector('.cat-row-fill'); if(fill) fill.style.width=rowPct+'%';
      var amt=rowEl.querySelector('.cat-row-allocation'); if(amt) amt.textContent=fmtF(row.target)+' / '+fmtF(secTotal);
      var pctEl=rowEl.querySelector('.cat-row-pct'); if(pctEl) pctEl.textContent=rowPct+'%';

  });

function setCategoryTarget(secIdx,rowIdx,val){
  var secs=customSecs?JSON.parse(JSON.stringify(customSecs)):JSON.parse(JSON.stringify(DEF_SECS));
  if(!secs[secIdx]||!secs[secIdx].rows[rowIdx]) return null;
  var newTarget=Math.max(0,parseFloat(val)||0),rowId=secs[secIdx].rows[rowIdx].id;
  secs[secIdx].rows[rowIdx].target=newTarget; cTargets[rowId]=newTarget; customSecs=secs;
  return {secs:secs,rowId:rowId};
}
function handleCategoryTargetInput(input){
  var secIdx=parseInt(input.dataset.secIdx,10),rowIdx=parseInt(input.dataset.rowIdx,10);
  if(isNaN(secIdx)||isNaN(rowIdx)) return;
  var res=setCategoryTarget(secIdx,rowIdx,input.value); if(!res) return;
  updateSettingsAllocationPreview(true); queueSave({delay:650});
}
function updateRowTarget(secIdx,rowIdx,val){ var res=setCategoryTarget(secIdx,rowIdx,val); if(!res) return; save(); showSaveConfirm(); refreshDashboardState({skipCategoryRender:false}); }
function toggleCategorySection(secId){ settingsOpenCats[secId]=!settingsOpenCats[secId]; renderCategoryManager(getSecs()); }
function toggleAddRow(secIdx){ var f=R('add-form-'+secIdx); if(f) f.classList.toggle('show'); }
function toggleAddSection(){ var f=R('add-sec-form'); if(f) f.classList.toggle('show'); }
function addRow(secIdx){
  var secs=customSecs?JSON.parse(JSON.stringify(customSecs)):JSON.parse(JSON.stringify(DEF_SECS));
  var eEl=R('emoji-'+secIdx),nEl=R('name-'+secIdx),tEl=R('target-'+secIdx);
  var emoji=(eEl&&eEl.value.trim())||'Tag',name=nEl?nEl.value.trim():'',target=tEl?parseFloat(tEl.value)||0:0;
  if(!name){ alert('Please enter a category name.'); return; }
  var id=name.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now();
  secs[secIdx].rows.push({id:id,name:name,emoji:emoji,target:target});
  customSecs=secs; save(); renderSettings(R('app')); renderPills(); renderPie(); showSaveConfirm();
}
function deleteRow(secIdx,rowIdx){
  if(!confirm('Delete this category? All saved data for it will be removed.')) return;
  var secs=customSecs?JSON.parse(JSON.stringify(customSecs)):JSON.parse(JSON.stringify(DEF_SECS));
  var rowId=secs[secIdx].rows[rowIdx].id;
  Object.keys(ST).forEach(function(key){ if(ST[key].expenses&&ST[key].expenses[rowId]) delete ST[key].expenses[rowId]; });
  secs[secIdx].rows.splice(rowIdx,1); customSecs=secs; save(); renderSettings(R('app')); showSaveConfirm();
}
function deleteSection(secIdx){
  if(!confirm('Delete this section and all its categories? This cannot be undone.')) return;
  var secs=customSecs?JSON.parse(JSON.stringify(customSecs)):JSON.parse(JSON.stringify(DEF_SECS));
  secs[secIdx].rows.forEach(function(row){ Object.keys(ST).forEach(function(key){ if(ST[key].expenses&&ST[key].expenses[row.id]) delete ST[key].expenses[row.id]; }); });
  secs.splice(secIdx,1); customSecs=secs; save(); renderSettings(R('app')); showSaveConfirm();
}
function addNewSection(){
  var iconEl=R('new-sec-icon'),titleEl=R('new-sec-title'),noteEl=R('new-sec-note'),colorEl=R('new-sec-color');
  var icon=iconEl&&iconEl.value.trim()||'Box',title=titleEl?titleEl.value.trim():'',note=noteEl&&noteEl.value.trim()||'Custom section',color=colorEl?colorEl.value:'#7F77DD';
  if(!title){ alert('Please enter a section title.'); return; }
  var secs=customSecs?JSON.parse(JSON.stringify(customSecs)):JSON.parse(JSON.stringify(DEF_SECS));
  var id=title.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now();
  secs.push({id:id,title:title,icon:icon,note:note,color:color,rows:[]});
  customSecs=secs; save(); renderSettings(R('app')); showSaveConfirm();
}
function resetToDefaults(){
  if(!confirm('Reset everything to defaults? Custom categories and their data will be lost.')) return;
  if(customSecs){ customSecs.forEach(function(sec){ sec.rows.forEach(function(row){ var inDef=false; DEF_SECS.forEach(function(ds){ ds.rows.forEach(function(dr){ if(dr.id===row.id) inDef=true; }); }); if(!inDef){ Object.keys(ST).forEach(function(key){ if(ST[key].expenses&&ST[key].expenses[row.id]) delete ST[key].expenses[row.id]; }); } }); }); }
  customSecs=null; cTargets={}; mBudget=32000; save(); renderSettings(R('app')); showSaveConfirm();
}
function showSaveConfirm(){ var ok=R('set-ok'); if(ok){ ok.style.opacity='1'; setTimeout(function(){ ok.style.opacity='0'; },1500); } }
