<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💵 Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F5F4F0;--bg2:#FFFFFF;--bg3:#EEECEA;--bg4:#E0DDD9;--bg5:#D5D2CE;
  --border:rgba(59,31,14,0.08);--border2:rgba(59,31,14,0.15);
  --text:#1A1208;--text2:#6B5C4E;--text3:#A89888;
  --accent:#3B1F0E;--accent2:#5C3420;--aglow:rgba(59,31,14,0.08);
  --green:#639922;--gbg:rgba(99,153,34,0.08);
  --red:#E24B4A;--rbg:rgba(226,75,74,0.08);--blue:#378ADD;
  --r:12px;--rl:18px;
  --font:'Montserrat','Segoe UI',sans-serif;--mono:'JetBrains Mono',monospace;
  --sw:275px;--tw:300px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
body{min-height:100vh}

/* ── SHELL ── */
.shell{
  display:flex;
  align-items:stretch;
  min-height:100vh;
  height:auto;
}

/* ══════════════════════════════════════════
   SIDEBAR — single continuous vertical rail
   ══════════════════════════════════════════ */
.sidebar{
  position:sticky;
  top:0;
  width:var(--sw);
  height:100vh;
  min-height:100vh;
  max-height:100vh;
  align-self:flex-start;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  overflow-y:auto;          /* ← CHANGED: allow sidebar itself to scroll */
  overflow-x:hidden;
  scrollbar-width:thin;
  scrollbar-color:rgba(59,31,14,.20) transparent;
  background:rgba(238,236,234,.88);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(59,31,14,.10);
}

.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(59,31,14,.20);border-radius:999px}

/* ── Logo block ── */
.sidebar-logo{
  flex:0 0 auto;
  padding:1.1rem 1rem 0.85rem;
}

/* ── Views block ── */
.sidebar-views{
  flex:0 0 auto;
  padding:0 1rem 0.5rem;
}

/* ── Separator ── */
.s-sep{
  flex:0 0 auto;
  height:1px;
  background:var(--border);
  margin:0;
}

/* ── Spending Mix block ── */
.sidebar-spending{
  flex:0 0 auto;
  padding:0.6rem 1rem 0.5rem;
}

/* ── Add Month block ── */
.sidebar-add{
  flex:0 0 auto;
  padding:0.5rem 1rem 0.6rem;
}

/* ── Months label ── */
.sidebar-months-lbl{
  flex:0 0 auto;
  padding:0.5rem 1rem 0.25rem;
  font-size:9px;
  font-weight:800;
  color:var(--text3);
  letter-spacing:0.14em;
  text-transform:uppercase;
}

/* ── Months list — ONLY this section scrolls ── */
.sidebar-months{
  flex:0 0 auto;            /* ← CHANGED: don't stretch, let content define height */
  min-height:0;
  overflow-y:visible;       /* ← CHANGED: no inner scroll, outer sidebar scrolls */
  overflow-x:hidden;
  padding:0 1rem 0.75rem;
}

.sidebar-months::-webkit-scrollbar{width:4px}
.sidebar-months::-webkit-scrollbar-thumb{background:rgba(59,31,14,.18);border-radius:999px}
.sidebar-months-inner{padding-bottom:.5rem}

/* ── Footer ── */
.s-footer{
  flex:0 0 auto;
  padding:0.55rem 1rem 0.7rem;
  border-top:1px solid var(--border);
  background:rgba(238,236,234,.96);
  backdrop-filter:blur(14px);
  position:sticky;          /* ← ADD: sticks to bottom of sidebar scroll area */
  bottom:0;
  z-index:2;
}


/* ── Shared nav label (used inside views) ── */
.nav-lbl{
  font-size:9px;font-weight:800;color:var(--text3);
  letter-spacing:0.14em;text-transform:uppercase;
  padding:0.5rem 0 0.25rem;
}

/* ── Spending Mix — flush, no card ── */
.spie-wrap{
  /* no background, no border, no shadow — lives inside the rail */
}
.spie-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.55rem}
.spie-title{font-size:9px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:0.13em}
.spie-badge{font-size:8px;font-weight:700;color:var(--accent);background:var(--aglow);border:1px solid var(--border2);padding:2px 7px;border-radius:10px}
.spie-canvas-wrap{position:relative;width:100%;max-width:170px;margin:0 auto;aspect-ratio:1/1}
.spie-canvas-wrap canvas{width:100%!important;height:100%!important}
.spie-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:58%}
.spie-amt{font-size:15px;font-weight:800;font-family:var(--font);color:var(--text);letter-spacing:-0.8px;line-height:1.1}
.spie-lbl{font-size:8px;font-weight:600;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;margin-top:3px}
.spie-legend{display:flex;flex-direction:column;gap:5px;margin-top:0.65rem}
.spl-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.spl-left{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.spl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.spl-name{font-size:10px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spl-right{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-shrink:0}
.spl-val{font-size:10px;font-family:var(--mono);color:var(--text);font-weight:600}
.spl-pct{font-size:8px;font-family:var(--mono);font-weight:600;padding:1px 5px;border-radius:999px;border:0;outline:0;box-shadow:none;line-height:1.35}
.spie-empty{text-align:center;padding:1rem 0;font-size:11px;color:var(--text3);font-weight:500}

/* ── Add Month form ── */
.add-form{display:flex;flex-direction:column;gap:6px;padding:0.2rem 0 0}
.add-form select{background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:12px;font-weight:600;padding:7px 10px;border-radius:8px;outline:none;cursor:pointer;width:100%}
.add-form select option{background:var(--bg2);color:var(--text)}
.btn-add{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px;font-size:13px;font-family:var(--font);cursor:pointer;font-weight:700;transition:all 0.15s;width:100%}
.btn-add:hover{opacity:0.88;transform:translateY(-1px)}

/* ── Nav buttons ── */
.nav-btn{width:100%;text-align:left;background:transparent;border:none;color:var(--text2);font-family:var(--font);font-size:13px;font-weight:600;padding:7px 10px;border-radius:var(--r);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:9px;min-height:36px}
.nav-btn:hover{background:var(--bg4);color:var(--text)}
.nav-btn.active{background:linear-gradient(135deg,#3B1F0E,#7B4A2D);color:#fff;box-shadow:0 8px 20px rgba(59,31,14,.22)}
.nav-btn .ni{font-size:15px;width:20px;text-align:center}

/* ── Month pills ── */
.sidebar-month-group{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.sidebar-month-heading{font-size:9px;font-weight:900;color:var(--text3);letter-spacing:.14em;text-transform:uppercase;padding:0 2px 3px}

.mpill{width:100%;text-align:left;background:rgba(255,255,255,.55);border:1px solid rgba(59,31,14,.08);color:var(--text3);font-family:var(--font);font-size:11px;font-weight:600;padding:7px 10px;border-radius:12px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mpill:hover{background:var(--bg4);color:var(--text2);transform:translateY(-1px)}
.mpill.active{background:linear-gradient(135deg,#3B1F0E,#7B4A2D);color:#fff;font-weight:700;box-shadow:0 10px 22px rgba(59,31,14,.22)}
.mpill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0.6;flex-shrink:0}
.mpill-month{white-space:nowrap;flex-shrink:0}

.month-card-pill{min-height:50px;padding:8px 10px;border-radius:14px;backdrop-filter:blur(14px)}
.mpill.active.current-month{background:linear-gradient(135deg,#3B1F0E 0%,#7B4A2D 56%,#B87942 100%);border-color:rgba(255,255,255,.22);box-shadow:0 16px 30px rgba(59,31,14,.26)}
.mpill-main{display:grid;grid-template-columns:minmax(0,1fr) max-content;align-items:center;gap:8px;width:100%}
.mpill-left,.mpill-right{display:flex;flex-direction:column;gap:3px;min-width:0}
.mpill-right{align-items:flex-end;text-align:right}
.mpill-title{font-size:12px;font-weight:800;line-height:1.1;color:inherit}
.mpill-sub{display:none}
.mpill-spent{font-size:11px;font-weight:800;font-family:var(--mono);color:var(--green)!important;line-height:1.1;white-space:nowrap}
.mpill.over:not(.active) .mpill-spent{color:var(--red)!important}
.mpill.under:not(.active) .mpill-spent{color:var(--green)!important}
.mpill.active .mpill-spent{color:#fff!important}
.mpill-net{display:none}

.year-group{border:1px solid rgba(59,31,14,.08);background:rgba(255,255,255,.38);border-radius:13px;overflow:hidden;margin-bottom:6px}
.year-toggle{width:100%;border:0;background:transparent;color:var(--text);font-family:var(--font);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:9px 10px;cursor:pointer}
.year-arrow{font-size:10px;color:var(--text3);transition:transform .18s ease}
.year-group.open .year-arrow{transform:rotate(90deg)}
.year-title{font-size:12px;font-weight:900;text-align:left}
.year-total{font-size:11px;font-weight:850;font-family:var(--mono);color:var(--text2)}
.year-months{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
.year-group.open .year-months{grid-template-rows:1fr}
.year-months-inner{overflow:hidden;padding:0 7px}
.year-months-inner .mpill{margin-bottom:6px}

/* ── Sync footer ── */
.s-sync{font-size:10px;font-weight:600;color:var(--text3);display:flex;align-items:center;gap:5px}
.s-sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}

/* ════════════════════════════
   MAIN CONTENT
   ════════════════════════════ */
.main{flex:1;padding:2rem 2.25rem 2.5rem;overflow-x:hidden;min-width:0}

.logo{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-0.5px;color:var(--text)}
.logo-sub{font-size:11px;font-weight:500;color:var(--text3);display:block;margin-top:2px}
.logo-icon{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

.sdiv{height:1px;background:var(--border);margin:0.4rem 0;flex-shrink:0}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding:0.75rem 1.1rem;background:rgba(255,252,247,.82);border:1px solid rgba(59,31,14,.1);border-radius:14px;gap:12px;flex-wrap:wrap;backdrop-filter:blur(16px);box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-greeting{font-size:13px;font-weight:700;color:var(--text)}
.tb-sub{font-size:11px;font-weight:500;color:var(--text3)}
.tb-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tb-clock{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.tb-time{font-size:18px;font-weight:800;font-family:var(--mono);color:var(--text);letter-spacing:-0.5px;line-height:1}
.tb-date{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:0.03em}
.tb-sync{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 10px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
.sync-txt{font-size:10px;font-weight:600;color:var(--text2)}
.sync-val{font-size:10px;font-weight:700;color:var(--green)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.tracker-layout{display:flex;gap:1.5rem;align-items:flex-start}
.tracker-content{flex:1;min-width:0}
.txn-panel{width:var(--tw);flex-shrink:0;position:sticky;top:1rem}

.page-header{margin-bottom:1.75rem}
.page-title{font-size:28px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:10px;letter-spacing:-1px}
.page-sub{font-size:12.5px;color:#7A6B5E;margin-top:5px;font-weight:500}

.save-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:var(--gbg);padding:4px 10px;border-radius:20px;border:1px solid rgba(99,153,34,0.2);opacity:0;transition:opacity 0.3s;margin-left:12px;font-weight:700}
.save-badge.show{opacity:1}

.vtabs{display:flex;gap:4px;margin-bottom:1.75rem;background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:16px;padding:5px;width:fit-content;flex-wrap:wrap;backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.vtab{background:transparent;border:none;color:var(--text2);font-family:var(--font);font-size:13px;font-weight:700;padding:8px 16px;border-radius:12px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.vtab:hover{color:var(--text);background:var(--bg3)}
.vtab.active{background:linear-gradient(135deg,#3B1F0E,#7B4A2D);color:#fff;box-shadow:0 10px 24px rgba(59,31,14,.26)}

.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-bottom:1.55rem;align-items:stretch}
.scard{height:150px;background:#FFFFFF;border:1px solid rgba(231,221,209,.86);border-radius:24px;padding:16px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(74,42,22,.055),0 1px 3px rgba(74,42,22,.035);display:flex;flex-direction:column;cursor:default}
.scard:hover{border-color:rgba(107,61,31,.18);transform:translateY(-2px);box-shadow:0 16px 30px rgba(74,42,22,.085),0 2px 6px rgba(74,42,22,.04)}
.scard:active{transform:translateY(-1px) scale(.998)}
.scard-top,.scard-mid{position:relative;z-index:1}
.scard-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.scard-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}.scard-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;flex:0 1 auto}.scard-icon{width:42px;height:42px;flex:0 0 42px;border-radius:15px;background:#EFE7DD;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 7px 16px rgba(74,42,22,.07)}
.scard-title{min-width:0;flex:1 1 auto}
.scard-label{font-size:10px;color:#8A7B6B;font-weight:900;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard-badge{height:22px;width:max-content;max-width:fit-content;padding:0 8px;border-radius:999px;font-size:10px;font-weight:600;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:rgba(107,61,31,.08);color:#6B3D1F;display:inline-flex;align-items:center;justify-content:center;flex:0 1 auto}.scard-badge-compact,.scard-badge-dot{display:none}.scard-badge-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px currentColor;opacity:.75}
.scard-badge.success{background:rgba(34,197,94,.10);color:#22C55E}.scard-badge.warning{background:rgba(245,158,11,.10);color:#F59E0B}.scard-badge.danger{background:rgba(239,68,68,.10);color:#EF4444}.scard-badge.neutral{background:rgba(107,61,31,.08);color:#6B3D1F}
.scard-menu{width:27px;height:27px;flex:0 0 27px;border:1px solid rgba(231,221,209,.78);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8A7B6B;background:#FAF7F2;font-weight:900;font-size:14px}
.scard-mid{margin-top:auto;padding-top:12px;padding-right:70px}
.scard-val{font-size:29px;font-weight:900;font-family:var(--font);letter-spacing:0;color:#2B221B;line-height:1;white-space:nowrap}
.scard-val.green{color:#3BA55D}
.scard-val.red{color:#E25555}
.scard-sub{font-size:12px;color:#6B3D1F;margin-top:8px;font-weight:500;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard-sub .pos{color:#22C55E;font-weight:650}.scard-sub .neg{color:#EF4444;font-weight:650}.scard-sub .neu{color:#6B3D1F;font-weight:650}
.scard-spark{position:absolute;right:-18px;bottom:-10px;width:188px;height:72px;display:block;overflow:visible;opacity:.72;z-index:0}
.scard-spark .area{stroke:none;opacity:1}
.scard-spark .line{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 7px 10px rgba(74,42,22,.07));transition:opacity .18s ease}
.scard-spark.available .line,.scard-spark.remaining .line{stroke:#22C55E}
.scard-spark.target .line{stroke:#3B82F6}
.scard-spark.spent .line{stroke:#EF4444}
.scard:hover .scard-spark .line{opacity:.92}
.scard.available,.scard.remaining{color:#3BA55D}
.scard.target{color:#B87942}
.scard.spent{color:#E25555}

.str{display:flex;align-items:center;gap:10px;margin-bottom:0.85rem;margin-top:1.5rem}
.str h3{font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.12em;white-space:nowrap}
.str::after{content:'';flex:1;height:1px;background:var(--border)}

.bal-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:1px;background:var(--border);border-radius:var(--rl);overflow:hidden;border:1px solid var(--border);margin-bottom:0.5rem;box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.bh{background:var(--bg3);padding:10px 14px;display:flex;align-items:center;gap:8px}
.bh-logo{width:30px;height:20px;object-fit:contain;border-radius:3px;flex-shrink:0}
.bh-text{display:flex;flex-direction:column;gap:1px}
.bh-name{font-size:13px;font-weight:800;color:var(--text);letter-spacing:0.02em;font-family:var(--font)}
.bh-sub{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase}
.bc{background:var(--bg2);padding:9px 14px;font-size:13px;color:var(--text)}
.bc.lbl{color:var(--text2);font-size:12px;display:flex;align-items:center;gap:6px;font-weight:750}
.bc.mono{font-family:var(--mono);font-size:12px;color:var(--text2);font-weight:600}
.bc.tot{background:var(--bg3);font-family:var(--mono);font-size:13px;font-weight:700}
.bc.clos{background:var(--bg4);font-family:var(--mono);font-weight:800;font-size:13px}
.bc.clos.pos{color:var(--green)}
.bc.clos.neg{color:var(--red)}
.bc.auto{color:var(--green);font-family:var(--mono);font-size:12px;font-weight:600}
.atag{font-size:9px;background:var(--gbg);color:var(--green);border-radius:4px;padding:1px 5px;font-weight:800;margin-left:4px}
.bi{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:13px;width:100%;padding:0;font-weight:700}
.bi:focus{color:var(--blue)}
.bi::placeholder{color:var(--text3)}

.exp-sec{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,252,247,.76));border:1px solid rgba(59,31,14,.09);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06);transition:border-color .18s ease}
.exp-sec:hover{border-color:rgba(59,31,14,.16)}
.exp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.ehl{display:flex;align-items:center;gap:10px}
.eht{font-size:13px;font-weight:700;color:var(--text)}
.ehn{font-size:11px;color:var(--text3);margin-left:4px;font-weight:500}
.ehr{font-size:11px;color:var(--text2);display:flex;gap:14px;align-items:center;font-weight:600}
.ehr .ov{color:var(--red)}

table.et{width:100%;border-collapse:separate;border-spacing:0;display:block;min-width:760px}
table.et thead,table.et tbody{display:block;width:100%}
table.et tr{display:grid;grid-template-columns:var(--expense-grid,minmax(190px,2.2fr) minmax(112px,.82fr) minmax(112px,.9fr) minmax(112px,.9fr) minmax(120px,.9fr) minmax(112px,.82fr));width:100%}
table.et th,table.et td{display:flex;align-items:center;min-width:0;overflow:hidden}
table.et th{font-size:9px;font-weight:800;color:var(--text3);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);background:rgba(238,236,234,.72);letter-spacing:0.08em;text-transform:uppercase;vertical-align:middle}
table.et th.r{text-align:right;justify-content:flex-end}
table.et td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
table.et tr:last-child td{border-bottom:none}
table.et tr:hover td{background:rgba(245,244,240,.8)}
table.et td.r{text-align:right;justify-content:flex-end}
table.et td.mn{font-family:var(--mono);font-size:12px;color:#2F2419;font-weight:550}
table.et td.tt{font-family:var(--mono);font-size:12px;font-weight:600;color:#2F2419}

.eth-bank{display:flex;align-items:center;justify-content:flex-end;gap:6px;width:100%}
.eth-bank-logo{width:24px;height:15px;object-fit:contain;border-radius:2px;flex-shrink:0}
.eth-bank-name{font-size:12px;font-weight:800;color:var(--text);font-family:var(--font);letter-spacing:0.04em}
.cn{display:flex;align-items:center;gap:8px;font-weight:650;min-width:0;color:#1D1710}
.cn span:last-child{overflow:hidden;text-overflow:ellipsis}
.ce{font-size:16px;width:22px;text-align:center}
.ei,.fi{background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--text);font-family:var(--mono);font-size:12px;width:100%;max-width:108px;text-align:right;padding:2px 4px;border-radius:6px;transition:all 0.15s;min-height:28px}
.ei:focus,.fi:focus{background:#fff;color:var(--blue);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
.ei::placeholder,.fi::placeholder{color:var(--text3)}
.ei.over,.fi.over{color:var(--red);background:var(--rbg)}
.bdg{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:5px;font-weight:700}
.bdg.ok{color:var(--green);background:var(--gbg)}
.bdg.ov{color:var(--red);background:var(--rbg)}
.bdg.nt{color:var(--text3)}
.scard-val,.mini-stat-val,.mpill-spent,.year-total,.bc.mono,.bc.tot,.bc.clos,.bc.auto,.bi,.ei,.fi,.bdg,.ti,.budget-inp,.target-edit-input,.spl-val,.spl-pct,.txn-amt,.txn-bal-val,.archive-value,.alloc-amt,.alloc2-amt,.ql-amt,.qo2-total{
  font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
}
.scard-val,.mini-stat-val,.bc.tot,.bc.clos,.txn-amt,.archive-value{
  letter-spacing:0;
}
.spent-metric .exp-value{font-weight:650}
table.et .ei,table.et .fi{font-weight:550}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem;margin-bottom:1.25rem}
.ccrd{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:var(--rl);padding:1.25rem;transition:border-color 0.2s;box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.ccrd:hover{border-color:var(--border2)}
.ctitle{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:0.11em;margin-bottom:1rem}
.lrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:0.85rem}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);font-weight:500}
.ldot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

.btn-del{background:transparent;border:1px solid rgba(226,75,74,0.3);color:var(--red);font-family:var(--font);font-size:12px;font-weight:700;padding:6px 14px;border-radius:10px;cursor:pointer;transition:all 0.15s;margin-top:1.25rem}
.btn-del:hover{background:var(--rbg)}

.set-sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:1.25rem;box-shadow:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
table.st{width:100%;border-collapse:collapse}
table.st td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
table.st tr:last-child td{border-bottom:none}
table.st tr:hover td{background:var(--bg3)}
table.st td.sn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
table.st td.sv{text-align:right;width:160px}

.ti{background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--text);font-family:var(--mono);font-size:13px;width:120px;padding:7px 10px;border-radius:8px;text-align:right;transition:border-color 0.15s}
.ti:focus{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(127,119,221,.12)}

.reset-btn{background:transparent;border:1px solid var(--border2);color:var(--text2);font-family:var(--font);font-size:12px;font-weight:700;padding:5px 12px;border-radius:10px;cursor:pointer;transition:all 0.15s;margin-top:0.5rem}
.reset-btn:hover{background:var(--bg3);color:var(--text)}

.budget-inp{background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--green);font-family:var(--mono);font-size:18px;font-weight:800;width:160px;padding:8px 12px;border-radius:10px;text-align:right;transition:border-color 0.15s}
.budget-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,119,221,.12)}

.blr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.blr:last-child{border-bottom:none}
.blr-img{width:52px;height:34px;object-fit:contain;background:var(--bg3);border-radius:6px;padding:4px;border:1px solid var(--border2);flex-shrink:0}
.blr-info{flex:1}
.blr-name{font-size:13px;font-weight:700;color:var(--text)}
.blr-hint{font-size:11px;color:var(--text3);font-weight:500;margin-top:2px}
.blr-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--accent);font-family:var(--font);font-size:11px;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.blr-btn:hover{background:var(--bg4)}
.blr-file{display:none}

.empty{text-align:center;padding:5rem 2rem;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:1rem;display:block}
.empty h3{font-size:20px;font-weight:800;margin-bottom:0.5rem;color:var(--text)}
.empty p{font-size:13px;color:var(--text3);font-weight:500}

.cat-manager{margin-bottom:1.5rem}
.cat-sec-box{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:20px;box-shadow:0 10px 28px rgba(59,31,14,.06);overflow:hidden;margin-bottom:1rem}
.cat-sec-hdr{width:100%;border:none;border-bottom:1px solid rgba(59,31,14,.07);background:rgba(245,244,240,.72);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(120px,.7fr) minmax(0,max-content);align-items:center;gap:18px;padding:14px 16px;text-align:left;font-family:var(--font);cursor:pointer}
.cat-sec-title{display:flex;align-items:center;gap:12px;min-width:0}
.cat-title-main{display:block;font-size:14px;font-weight:900;color:var(--text);line-height:1.15}
.cat-sec-progress{min-width:120px}
.cat-sec-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:max-content}
.cat-pct-badge{font-family:var(--mono);font-size:11px;font-weight:900;color:var(--sec-color);background:#fff;border:1px solid rgba(59,31,14,.08);border-radius:999px;padding:6px 9px}
.cat-toggle{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid rgba(59,31,14,.08);color:var(--text2);transition:transform .18s ease}
.cat-sec-box.open .cat-toggle{transform:rotate(180deg)}
.cat-sec-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease,opacity .18s ease;opacity:1}
.cat-sec-box.collapsed .cat-sec-body{grid-template-rows:0fr;opacity:.1}
.cat-sec-body>*{overflow:hidden}
.cat-empty{padding:16px;font-size:12px;color:var(--text3);font-style:italic}
.cat-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(140px,.8fr) minmax(0,max-content);align-items:center;gap:18px;min-height:68px;padding:13px 16px;border-bottom:1px solid rgba(59,31,14,.07)}
.cat-row:last-child{border-bottom:none}
.cat-row:hover{background:rgba(245,244,240,.62)}
.cat-row-info{display:flex;align-items:center;gap:12px;min-width:0}
.cat-row-emoji{width:34px;height:34px;border-radius:12px;background:rgba(59,31,14,.05);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.cat-row-name{display:block;font-size:13px;font-weight:850;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row-sub{display:none}
.cat-row-progress{min-width:140px;display:grid;grid-template-columns:minmax(120px,1fr) max-content max-content;align-items:center;gap:12px}
.cat-row-bar{width:100%;height:7px;border-radius:999px;background:rgba(59,31,14,.08);overflow:hidden}
.cat-row-fill{display:block;height:100%;border-radius:inherit;background:var(--row-color)}
.cat-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.target-edit-input{width:104px;height:36px;text-align:right;font-family:var(--mono);font-size:12px;font-weight:850;border-radius:10px;padding:7px 10px;background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--green)}
.target-edit-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(127,119,221,.12)}
.add-cat-form{margin:0 16px 16px;border-radius:14px;border:1px solid rgba(59,31,14,.08);background:rgba(245,244,240,.72);padding:14px 16px;display:none}
.add-cat-form.show{display:block}
.add-cat-grid{display:grid;grid-template-columns:60px 1fr 130px;gap:8px;margin-bottom:10px}
.add-cat-input{background:rgba(255,255,255,.76);border:1px solid rgba(59,31,14,.13);outline:none;color:var(--text);font-family:var(--font);font-size:12px;padding:8px 10px;border-radius:8px;font-weight:600;width:100%}
.add-cat-input:focus{border-color:var(--accent)}
.add-cat-input::placeholder{color:var(--text3)}
.add-cat-input.emoji-field{text-align:center;font-size:16px}
.add-cat-input.target-field{font-family:var(--mono);text-align:right}

.add-sec-form{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rl);padding:16px;display:none;margin-bottom:1rem}
.add-sec-form.show{display:block}
.add-sec-grid{display:grid;grid-template-columns:60px 1fr 1fr 80px;gap:8px;margin-bottom:10px}
.color-input{width:100%;height:38px;border:1px solid var(--border2);border-radius:8px;cursor:pointer;padding:2px;background:var(--bg2)}
.form-label{font-size:10px;font-weight:800;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.1em;display:block}

/* ── TRANSACTION PANEL ── */
.txn-wrap{
  flex:0 0 auto;
  width:100%;
  min-height:0;
  height:auto;              /* stays auto */
  max-height:calc(100vh - 5rem);  /* ← ADD: caps height so it doesn't overflow */
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:22px;
  border-color:rgba(59,31,14,.09);
  background:linear-gradient(180deg,#fff 0%,rgba(255,252,247,.9) 100%);
}

.txn-hdr{padding:10px 13px 9px;background:linear-gradient(135deg,#3B1F0E 0%,#6B3A22 100%);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.txn-hdr-left{display:flex;align-items:center;gap:8px}
.txn-hdr-icon{width:28px;height:28px;background:rgba(255,255,255,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.txn-hdr-title{font-size:10px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:0.14em;line-height:1.2}
.txn-hdr-sub{font-size:8px;font-weight:500;color:rgba(255,255,255,0.55);letter-spacing:0.03em;margin-top:1px}
.txn-hdr-count{font-size:11px;font-weight:800;background:#fff;color:#3B1F0E;padding:2px 9px;border-radius:16px;flex-shrink:0}
.txn-recent-strip{display:flex;align-items:center;gap:6px;padding:6px 13px;background:#FFF8EE;border-bottom:1px solid rgba(232,160,32,0.15);flex-shrink:0}
.txn-recent-left{display:flex;align-items:center;gap:5px;flex-shrink:0}
.txn-recent-icon{font-size:11px;line-height:1}
.txn-recent-label{font-size:8px;font-weight:800;color:#E8A020;text-transform:uppercase;letter-spacing:0.10em}
.txn-recent-center{flex:1;font-size:9px;font-weight:700;color:#5C3C1E;font-family:var(--mono);text-align:center}
.txn-recent-pill{background:#EDE9E4;color:#A89888;font-size:8px;font-weight:700;padding:2px 8px;border-radius:16px;flex-shrink:0;font-family:var(--mono)}
.txn-list{overflow-y:auto;flex:1;padding:3px 8px 10px;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;background:#F7F6F2}
.txn-list::-webkit-scrollbar{width:3px}
.txn-list::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.txn-date-group{display:flex;align-items:center;gap:6px;padding:8px 2px 4px}
.txn-date-group-label{font-size:8px;font-weight:800;color:#B0A090;text-transform:uppercase;letter-spacing:0.13em;white-space:nowrap}
.txn-date-group-line{flex:1;height:1px;background:rgba(59,31,14,0.07)}
.txn-card{display:flex;align-items:stretch;background:#FFFFFF;border:1px solid rgba(59,31,14,0.06);border-radius:11px;margin-bottom:6px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,0.045);transition:box-shadow 0.15s,transform 0.15s;cursor:default}
.txn-card:hover{box-shadow:0 3px 12px rgba(0,0,0,0.08);transform:translateY(-1px)}
.txn-card:last-child{margin-bottom:0}
.txn-strip{width:3px;flex-shrink:0}
.txn-icon-col{padding:10px 8px 10px 9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.txn-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#F5F4F0}
.txn-info{flex:1;min-width:0;padding:9px 6px 9px 2px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.txn-name{font-size:12px;font-weight:700;color:#1A1208;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.txn-meta{display:flex;align-items:center;gap:4px}
.txn-month{font-size:9px;font-weight:600;color:#A89888;white-space:nowrap}
.txn-bank-chip{display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:4px;font-size:8px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;line-height:1.5;flex-shrink:0}
.txn-bank-chip.hsbc{background:#FEE2E2;color:#DC2626}
.txn-bank-chip.sbi{background:#DBEAFE;color:#1D6ED8}
.txn-route{display:block;font-size:8px;font-weight:800;color:#8C7B6A;text-transform:uppercase;letter-spacing:.05em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-bank-chip-logo{width:14px;height:9px;object-fit:contain;border-radius:1px;flex-shrink:0}
.txn-datetime{display:flex;align-items:center;gap:3px;font-size:8px;font-weight:600;color:#C4B5A5;font-family:var(--mono);line-height:1}
.txn-datetime-icon{font-size:9px}
.txn-right{padding:9px 11px 9px 4px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;flex-shrink:0;min-width:100px}
.txn-amt-row{display:flex;align-items:center;gap:3px}
.txn-amt{font-size:13px;font-weight:800;font-family:var(--mono);color:#1A1208;letter-spacing:-0.3px;white-space:nowrap}
.txn-arrow{font-size:11px;font-weight:900;line-height:1;flex-shrink:0}
.txn-arrow.debit{color:#E24B4A}
.txn-arrow.credit{color:#639922}
.txn-ago-pill{background:#F0EDE8;color:#A89888;font-size:8px;font-weight:700;padding:1px 7px;border-radius:16px;font-family:var(--mono);white-space:nowrap}
.txn-bal-label{font-size:7px;font-weight:800;color:#C4B5A5;text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap;margin-top:1px}
.txn-bal-val{font-size:10px;font-weight:700;font-family:var(--mono);color:#6B5C4E;white-space:nowrap;letter-spacing:-0.1px}
.txn-empty{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:11px;font-weight:500}
.txn-empty-icon{font-size:28px;display:block;margin-bottom:8px}
.txn-footer{padding:10px 2px 0}
.txn-view-all{width:100%;border:1px solid rgba(59,31,14,.12);background:rgba(255,255,255,.7);color:var(--accent);font-family:var(--font);font-size:12px;font-weight:900;border-radius:999px;padding:10px 12px;cursor:pointer;transition:all .16s ease}
.txn-view-all:hover{background:#fff;transform:translateY(-1px);box-shadow:0 10px 24px rgba(59,31,14,.08)}
.txn-archive-tools{display:flex;flex-direction:column;gap:8px;padding:10px 0}
.txn-filter{width:100%;border:1px solid rgba(59,31,14,.12);background:#fff;color:var(--text);font-family:var(--font);font-size:12px;font-weight:700;border-radius:12px;padding:9px 10px}
.txn-filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── Settings ── */
:root{--shadow-soft:0 18px 45px rgba(59,31,14,.08),0 2px 8px rgba(59,31,14,.05);--shadow-card:0 10px 28px rgba(59,31,14,.075),0 1px 3px rgba(59,31,14,.06)}
.settings-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,320px);gap:1.5rem;align-items:start}
.dash-card{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:22px;padding:1.15rem;box-shadow:var(--shadow-card);margin-bottom:1rem}
.dash-card-title{font-size:12px;font-weight:850;color:var(--text);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem}
.mini-stat{display:flex;align-items:center;gap:12px}
.mini-stat-icon{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px}
.mini-stat-val{font-size:22px;font-weight:850;font-family:var(--mono)}
.mini-stat-sub{font-size:12px;color:var(--text2);font-weight:650}

.settings-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:1.25rem}
.settings-tile{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:18px;padding:1rem;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-card)}
.settings-tile-icon,.section-icon,.alloc-icon{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.settings-tile-title,.section-heading{font-size:13px;font-weight:850}
.settings-tile-sub,.section-sub{font-size:11px;color:var(--text2);font-weight:650;margin-top:2px}
.settings-section{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,252,247,.72));border:1px solid rgba(59,31,14,.09);border-radius:22px;box-shadow:var(--shadow-card);margin-bottom:1rem;overflow:hidden}
.settings-section-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.15rem;border-bottom:1px solid rgba(59,31,14,.07);gap:12px}
.section-title-row{display:flex;align-items:center;gap:12px}
.settings-section-body{padding:.85rem 1rem}

.quick-donut-wrap{display:flex;align-items:center;justify-content:center;padding:6px 0 14px}
.quick-donut{width:min(210px,100%);max-width:210px;aspect-ratio:1;border-radius:50%;margin:0 auto;position:relative;box-shadow:inset 0 0 0 1px rgba(59,31,14,.06),0 16px 32px rgba(59,31,14,.08)}

/* ── Tracker layout ── */
:root{--expense-grid:minmax(190px,2.2fr) minmax(112px,.82fr) minmax(112px,.9fr) minmax(112px,.9fr) minmax(120px,.9fr) minmax(112px,.82fr)}
.tracker-layout{
  display:grid;

  align-items:start;        /* ← CHANGED: was stretch, now start */

  width:100%;
}

.tracker-content{
  min-width:0;
  min-height:0;
  height:auto;              /* ← ADD */
  display:flex;
  flex-direction:column;
}

.txn-panel{
  position:sticky;          /* ← CHANGED: sticky so it follows scroll */
  top:1rem;                 /* ← ADD */
  align-self:start;         /* ← CHANGED: was stretch */

  width:auto;
  min-width:0;
  min-height:0;
  height:auto;              /* ← CHANGED: was 100% */

.dashboard-grid{display:grid;grid-template-columns:1fr;gap:1.25rem;align-items:start;margin-bottom:1.15rem}

.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.account-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,252,247,.68));border:1px solid rgba(59,31,14,.09);border-radius:20px;padding:13px 14px;box-shadow:var(--shadow-card);backdrop-filter:blur(16px);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}

.account-mask{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text2);margin-top:2px}
.account-type{font-size:11px;font-weight:700;color:var(--text3);margin-top:3px}
.account-status{justify-self:end;align-self:start;font-size:9px;font-weight:900;color:var(--green);background:rgba(99,153,34,.12);border:1px solid rgba(99,153,34,.22);padding:4px 8px;border-radius:999px}
.savings-goals{display:flex;flex-direction:column;gap:10px}
.savings-goals-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.savings-title{font-size:11px;font-weight:900;color:var(--text2);letter-spacing:.1em;text-transform:uppercase}
.fund-add-btn{border:0;background:rgba(59,31,14,.07);color:var(--text);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:850;cursor:pointer}

.fund-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fund-grid .account-card{align-items:stretch}
.fund-card{position:relative;display:flex;flex-direction:column;gap:9px;min-height:108px;padding:12px 13px;border-radius:16px;border-left:3px solid var(--fund-color);box-shadow:0 8px 20px rgba(59,31,14,.055)}

.fund-menu button{width:100%;border:0;background:transparent;color:var(--text);font-family:var(--font);font-size:11px;font-weight:750;text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer}

.modal-backdrop{position:fixed;inset:0;background:rgba(26,18,8,.36);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}
.modal-card{width:min(560px,100%);max-height:min(760px,92vh);overflow:auto;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,252,247,.9));border:1px solid rgba(59,31,14,.14);border-radius:22px;box-shadow:0 30px 80px rgba(26,18,8,.24)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid rgba(59,31,14,.08)}

.modal-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}

.modal-field input,.modal-field select{width:100%;background:rgba(255,255,255,.88);border:1px solid rgba(59,31,14,.14);border-radius:12px;padding:10px 12px;font-family:var(--font);font-size:13px;font-weight:700;color:var(--text);outline:none}

@media(max-width:600px){.modal-tabs,.fund-modal-stats,.confirm-grid{grid-template-columns:1fr}.modal-card{max-height:94vh}.modal-body{padding:14px}.modal-head{padding:16px}}

.exp-card{position:relative;padding:10px 14px 9px;border-left:4px solid var(--sec-color);background:linear-gradient(135deg,var(--sec-tint),rgba(255,255,255,.78) 54%,rgba(255,255,255,.62))}

.alloc2-bar{
  height:6px;
  border-radius:999px;
  background:rgba(59,31,14,.08);
  overflow:hidden;
  width:100%;
}
.alloc2-bar span{
  display:block;
  height:100%;
  border-radius:inherit;
}
.alloc2-meta{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
}
.alloc2-amt{
  font-size:12px;
  font-weight:700;
  color:var(--text2);
  font-family:var(--mono);
}
.alloc2-pct{
  font-size:22px;
  font-weight:900;
  font-family:var(--font);
  letter-spacing:-0.5px;
}

/* ── Quick Overview card redesign ── */
.quick-overview-card2{
  background:#fff;
  border:1px solid rgba(59,31,14,.09);
  border-radius:22px;
  padding:1.25rem 1.25rem 1rem;
  box-shadow:0 4px 16px rgba(59,31,14,.06);
  display:flex;
  flex-direction:column;
  gap:0;
  height:100%;
}
.qo2-title{
  font-size:11px;
  font-weight:900;
  color:var(--text);
  letter-spacing:0.1em;
  text-transform:uppercase;
  margin-bottom:1rem;
}
.qo2-donut-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0.5rem 0 1rem;
  flex:0 0 auto;
}
.qo2-donut{
  width:min(200px,100%);
  max-width:200px;
  aspect-ratio:1;
  border-radius:50%;
  position:relative;
  box-shadow:0 8px 24px rgba(59,31,14,.10);
}
.qo2-donut-inner{
  position:absolute;
  inset:25%;
  border-radius:50%;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-shadow:inset 0 0 0 1px rgba(59,31,14,.06);
}
.qo2-total{
  font-size:13px;
  font-weight:900;
  color:var(--text);
  letter-spacing:-0.3px;
  line-height:1.2;
}
.qo2-lbl{
  font-size:9px;
  font-weight:700;
  color:var(--text3);
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-top:2px;
}
.qo2-legend{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:auto;
}
.ql-row{
  display:flex;
  align-items:center;
  gap:8px;
}
.ql-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex-shrink:0;
}
.ql-name{
  flex:1;
  font-size:12px;
  font-weight:600;
  color:var(--text2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ql-amt{
  font-size:11px;
  font-weight:700;
  font-family:var(--mono);
  color:var(--text);
  white-space:nowrap;
}
.ql-pct{
  font-size:10px;
  font-weight:800;
  padding:2px 7px;
  border-radius:999px;
  white-space:nowrap;
  font-family:var(--mono);
}

/* ── Settings top grid fix for new layout ── */
.settings-top-grid{
  display:grid;
  grid-template-columns:minmax(0,1.4fr) minmax(260px,.55fr);
  gap:1.1rem;
  align-items:stretch;
}
.budget-panel .settings-section-body{
  padding:1rem;
}

@media(max-width:1100px){
  .alloc-summary{
    grid-template-columns:repeat(2,1fr);
  }
  .settings-top-grid{
    grid-template-columns:1fr;
  }
  .quick-overview-card2{
    height:auto;
  }
}
@media(max-width:600px){
  .alloc-summary{
    grid-template-columns:1fr;
  }
}


.savings-goals{display:flex;flex-direction:column;gap:10px;margin-top:-2px}

.savings-title{font-size:11px;font-weight:900;color:var(--text2);letter-spacing:.1em;text-transform:uppercase}
.fund-add-btn{border:0;background:rgba(59,31,14,.07);color:var(--text);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:850;cursor:pointer;white-space:nowrap}
.fund-add-btn:hover{background:rgba(59,31,14,.11);transform:translateY(-1px)}

.fund-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.fund-card-title{display:flex;align-items:center;gap:8px;min-width:0}
.fund-logo{width:28px;height:28px;border-radius:10px;font-size:16px;color:var(--fund-color);background:var(--fund-soft);border:1px solid var(--fund-border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fund-name{font-size:13px;font-weight:900;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fund-card-tools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.fund-active{font-size:8px;font-weight:850;color:var(--fund-color);background:var(--fund-soft);border:1px solid var(--fund-border);padding:3px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.fund-menu-btn{width:24px;height:24px;border:0;border-radius:8px;background:transparent;color:var(--text2);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fund-menu-btn:hover{background:rgba(59,31,14,.07);color:var(--text)}
.fund-balance{font-family:var(--mono);font-size:19px;font-weight:900;color:var(--text);line-height:1.05}
.fund-goal-line{font-size:10px;font-weight:760;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fund-goal-line strong{color:var(--fund-color);font-weight:900}
.fund-progress{height:6px;border-radius:999px;background:rgba(59,31,14,.08);overflow:hidden}
.fund-progress span{display:block;height:100%;border-radius:inherit;background:var(--fund-color);box-shadow:0 0 12px var(--fund-soft)}
.fund-menu{position:absolute;right:10px;top:38px;width:184px;background:#fff;border:1px solid rgba(59,31,14,.1);border-radius:14px;box-shadow:0 18px 40px rgba(26,18,8,.16);padding:6px;z-index:20}
.fund-menu button{width:100%;border:0;background:transparent;color:var(--text);font-family:var(--font);font-size:11px;font-weight:760;text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer}
.fund-menu button:hover{background:rgba(59,31,14,.06)}
.fund-menu button.danger{color:var(--red)}
.fund-empty{border:1px dashed rgba(59,31,14,.16);border-radius:16px;padding:14px;background:rgba(255,255,255,.48);font-size:12px;font-weight:750;color:var(--text2)}
.modal-card.wide{width:min(720px,100%)}
.icon-picker,.color-picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.icon-choice,.color-choice{border:1px solid rgba(59,31,14,.12);background:#fff;border-radius:12px;padding:8px 6px;font-family:var(--font);font-size:11px;font-weight:850;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;min-height:38px}
.icon-choice.active,.color-choice.active{border-color:var(--fund-color);background:var(--fund-soft);color:var(--text)}
.color-swatch{width:12px;height:12px;border-radius:50%;background:var(--choice-color);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.fund-history-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding-right:2px}
.fund-history-row{display:grid;grid-template-columns:minmax(120px,1fr) max-content max-content;gap:10px;align-items:center;background:#fff;border:1px solid rgba(59,31,14,.08);border-radius:13px;padding:10px}
.fund-history-kind{font-size:12px;font-weight:900;color:var(--text)}
.fund-history-date{font-size:10px;font-weight:700;color:var(--text3);margin-top:2px}
.fund-history-amt,.fund-history-bal{font-family:var(--mono);font-size:12px;font-weight:900;color:var(--text);text-align:right;white-space:nowrap}
.fund-history-amt.deposit{color:var(--green)}
.fund-history-amt.redemption{color:var(--red)}
.fund-settings-list{display:flex;flex-direction:column;gap:10px}
.fund-settings-row{display:grid;grid-template-columns:minmax(150px,1fr) max-content max-content;gap:10px;align-items:center;background:#fff;border:1px solid rgba(59,31,14,.08);border-radius:14px;padding:10px 12px}
.fund-settings-title{font-size:13px;font-weight:900;color:var(--text)}
.fund-settings-sub{font-size:10px;font-weight:700;color:var(--text3);margin-top:2px}
@media(max-width:600px){.icon-picker,.color-picker,.fund-history-row,.fund-settings-row,.fund-grid{grid-template-columns:1fr}}

ease;flex:0 0 auto}.new-txn-btn:hover .new-txn-arrow{transform:translateX(4px)}.new-txn-spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#D9A441;box-shadow:0 0 0 3px rgba(217,164,65,.12);pointer-events:none;z-index:2}.new-txn-spark.s1{right:24px;top:-6px;animation:newTxnFloat 3.2s ease-in-out infinite}.new-txn-spark.s2{left:38px;bottom:-7px;width:4px;height:4px;opacity:.82;animation:newTxnFloat 3.7s ease-in-out .45s infinite}.new-txn-arc{position:absolute;right:15px;bottom:-9px;width:54px;height:22px;border-bottom:2px solid rgba(217,164,65,.58);border-radius:0 0 999px 999px;transform:rotate(-8deg);pointer-events:none}.txn-desc{font-size:10px;font-weight:650;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;max-width:138px}.gtxn-card-actions{display:flex;gap:5px;margin-top:7px;justify-content:flex-end}.gtxn-mini-btn{border:1px solid rgba(59,31,14,.12);background:#fff;color:var(--text2);border-radius:8px;font-family:var(--font);font-size:9px;font-weight:800;padding:4px 7px;cursor:pointer}.gtxn-mini-btn.danger{color:var(--red);border-color:rgba(226,75,74,.24)}@keyframes newTxnRipple{from{opacity:1;transform:scale(.58)}to{opacity:0;transform:scale(1.45)}}@keyframes newTxnFloat{0%,100%{transform:translateY(0);opacity:.68}50%{transform:translateY(-4px);opacity:1}}

/* Premium transaction modal */
.gtxn-backdrop{position:fixed;inset:0;background:rgba(43,34,27,.32);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;animation:modalFade .25s ease both}
.gtxn-modal{width:min(1400px,100%);max-height:min(92vh,900px);overflow:hidden;background:#FAF7F2;border:1px solid #E7DDD1;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.12);display:flex;flex-direction:column;animation:modalScale .25s ease both}
@keyframes modalFade{from{opacity:0}to{opacity:1}}@keyframes modalScale{from{transform:scale(.98)}to{transform:scale(1)}}
.gtxn-head{display:flex;justify-content:space-between;gap:18px;padding:22px 24px 14px}
.gtxn-title{font-size:24px;font-weight:900;color:#2B221B;letter-spacing:0}
.gtxn-sub{font-size:12px;color:#8A7B6B;font-weight:650;margin-top:4px}
.gtxn-close{width:38px;height:38px;border:1px solid #E7DDD1;border-radius:14px;background:#FFFFFF;color:#4A2A16;font-size:24px;cursor:pointer;transition:all .18s ease}
.gtxn-close:hover{transform:translateY(-1px);box-shadow:0 10px 18px rgba(74,42,22,.08)}
.gtxn-body{display:grid;grid-template-columns:260px minmax(440px,1fr) 320px;gap:20px;padding:10px 24px 24px;overflow:auto}
.gtxn-panel{background:#FFFFFF;border:1px solid #E7DDD1;border-radius:24px;padding:16px;min-width:0;box-shadow:0 14px 32px rgba(74,42,22,.055)}
.gtxn-form-card{position:relative;padding:22px}
.gtxn-panel-title{font-size:10px;font-weight:900;color:#8A7B6B;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.gtxn-section-list{display:flex;flex-direction:column;gap:12px;max-height:650px;overflow:auto;padding-right:2px}

.gtxn-section-btn:hover{transform:translateY(-2px);box-shadow:0 14px 24px rgba(74,42,22,.08)}
.gtxn-section-btn.active{border-color:#6B3D1F;background:#EFE7DD;box-shadow:0 14px 26px rgba(107,61,31,.10)}
.gtxn-section-ico{width:42px;height:42px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:#EFE7DD;color:#6B3D1F;font-size:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.gtxn-section-name{font-size:13px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtxn-section-note{font-size:11px;font-weight:650;color:#8A7B6B;display:block;margin-top:4px}
.gtxn-illustration{position:absolute;right:20px;top:18px;width:92px;height:62px;border-radius:20px;background:linear-gradient(135deg,#EFE7DD,#FFFFFF);border:1px solid #E7DDD1;box-shadow:0 12px 24px rgba(74,42,22,.07);display:flex;align-items:center;justify-content:center;color:#B87942;font-size:28px}
.gtxn-illustration:before{content:'₹';position:absolute;left:13px;bottom:8px;width:24px;height:24px;border-radius:50%;background:#B87942;color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}
.gtxn-type-row{display:flex;gap:8px;margin:0 110px 18px 0}
.gtxn-type{border:1px solid #E7DDD1;background:#FFFFFF;color:#8A7B6B;border-radius:999px;padding:9px 13px;font-family:var(--font);font-weight:850;cursor:pointer;min-width:96px;transition:all .18s ease}
.gtxn-type.active{background:#6B3D1F;color:#fff;border-color:#6B3D1F;box-shadow:0 10px 20px rgba(107,61,31,.18)}
.gtxn-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gtxn-field{display:flex;flex-direction:column;gap:8px;position:relative}
.gtxn-field.full{grid-column:1/-1}
.gtxn-field label{font-size:10px;font-weight:900;color:#8A7B6B;letter-spacing:.09em;text-transform:uppercase}

.gtxn-currency{font-size:30px;font-weight:900;color:#6B3D1F}
.gtxn-amount{height:72px!important;border:0!important;box-shadow:none!important;background:transparent!important;padding:0!important;font-size:34px!important;font-weight:900!important;font-family:var(--font)!important;color:#2B221B!important}
.gtxn-live-preview{min-height:20px;margin-top:9px;font-size:12px;font-weight:750;color:#8A7B6B}

.gtxn-summary{display:flex;flex-direction:column;gap:12px}
.gtxn-stat{background:#FFFFFF;border:1px solid #E7DDD1;border-radius:18px;padding:13px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.gtxn-stat .si{width:30px;height:30px;border-radius:12px;background:#EFE7DD;display:flex;align-items:center;justify-content:center}
.gtxn-stat span{font-size:11px;font-weight:800;color:#8A7B6B}
.gtxn-stat strong{font-size:13px;font-weight:900;color:#2B221B;font-family:var(--font);text-align:right;white-space:nowrap}
.gtxn-insight{border-radius:20px;padding:14px;border:1px solid #E7DDD1;background:#FFFFFF;display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.gtxn-insight span{font-size:10px;font-weight:900;color:#8A7B6B;letter-spacing:.08em;text-transform:uppercase}
.gtxn-insight strong{display:block;margin-top:5px;font-size:18px;font-weight:900;color:#2B221B;font-family:var(--font)}
.gtxn-insight.green{background:rgba(59,165,93,.08);border-color:rgba(59,165,93,.18)}.gtxn-insight.green strong{color:#3BA55D}
.gtxn-insight.red{background:rgba(226,85,85,.08);border-color:rgba(226,85,85,.18)}.gtxn-insight.red strong{color:#E25555}

.gtxn-trend{width:58px;height:24px;color:#3BA55D}
.gtxn-error{display:none;color:#E25555;background:rgba(226,85,85,.08);border:1px solid rgba(226,85,85,.18);border-radius:14px;padding:10px 12px;font-size:12px;font-weight:800;margin-top:12px}.gtxn-error.show{display:block}

function updateSync(){

  var d=Math.floor((Date.now()-lastSave)/1000);
  var txt=d<10?'just now':d<60?d+'s ago':d<3600?Math.floor(d/60)+'m ago':Math.floor(d/3600)+'h ago';
  if(el1) el1.textContent=txt;
  if(el2) el2.textContent='🔥 Synced '+txt;
}

function addMonth(){

  var key=m+'-'+y;

  if(!ST[key]) ST[key]={income:{},expenses:{},transfers:{}};

function delMonth(){
  if(!cur||!ST[cur]){ alert('Select a month before deleting.'); return; }
  if(!confirm('Archive '+cur+'? The month will move to Archived Months and can be restored later.')) return;
  archivedMonths[cur]=makeArchivedMonth(cur);

function restoreMonth(key){
  var a=getArchiveEntry(key);

  mergeArchivedSettings(a);

  delete archivedMonths[key];

function permanentlyDeleteArchivedMonth(key){

  delete archivedMonths[key];

function addTxnBalances(txns){
  var months=sortedKeys();
  function getFinalClosing(bank){
    if(!months.length) return 0;
    var balCache={};
    function getClosingForMonth(monthKey,b){
      var ck=monthKey+'_'+b; if(balCache[ck]!==undefined) return balCache[ck];
      var inc={}; try{ inc=ST[monthKey].income||{}; }catch(e){}
      var prevK=prevLedgerKey(monthKey);
      var obField=b==='hsbc'?'ob_hsbc':'ob_sbi',ob;
      if(hasManualValue(inc,obField)) ob=numField(inc,obField);
      else if(prevK&&ST[prevK]) ob=getClosingForMonth(prevK,b);
      else if(prevK) ob=getArchivedClosing(prevK,b);
      else ob=0;
      var salF=b==='hsbc'?'sal_hsbc':'sal_sbi',othF=b==='hsbc'?'oth_hsbc':'oth_sbi';
      var sal=numField(inc,salF),oth=numField(inc,othF),spent=0;
      getSecs().forEach(function(sec){ sec.rows.forEach(function(row){ if(isFundTransferRow(row.id)) spent+=getMonthTransfers(monthKey,FUND_ROWS[row.id],b); else spent+=getX(monthKey,row.id,b); }); });
      var red=getMonthRedemptions(monthKey,'travel',b)+getMonthRedemptions(monthKey,'emergency',b);
      var closing=ob+sal+oth+red-spent; balCache[ck]=closing; return closing;
    }
    return getClosingForMonth(months[months.length-1],bank);
  }
  var runningBal={hsbc:getFinalClosing('hsbc'),sbi:getFinalClosing('sbi')};
  return txns.map(function(tx){
    if(runningBal[tx.acc]===undefined) runningBal[tx.acc]=0;
    var bal=runningBal[tx.acc];
    if(tx.type==='expense'||tx.type==='transfer') runningBal[tx.acc]=bal+tx.amt;
    else runningBal[tx.acc]=bal-tx.amt;
    return Object.assign({},tx,{displayBal:bal});
  });
}

function handleInput(e){
  var t=e.target;
  if(t.classList.contains('bi')){
    ensureMonthData(cur);
    ST[cur].income[t.dataset.inc]=parseFloat(t.value)||0;
    recalcBal(); renderPie(); queueSave({month:cur});
  } else if(t.classList.contains('fi')){
    var sec=t.dataset.sec,row=t.dataset.row,acc=t.dataset.acc,kind=FUND_ROWS[row]; if(!kind) return;
    ensureMonthData(cur); if(!ST[cur].transfers[kind]) ST[cur].transfers[kind]={};
    var nextVal=parseFloat(t.value)||0,prevVal=getMonthTransfers(cur,kind,acc),delta=nextVal-prevVal;
    ST[cur].transfers[kind][acc]=nextVal;
    var def=getFundDef(kind),ts=Date.now()+(++fundActionSeq),id=fundTxId(cur,kind,acc,'deposit');
    if(delta!==0){
      if(nextVal>0) upsertTransaction(cur,{id:id,type:'transfer',transactionType:def.transferName,name:def.transferName,emoji:def.emoji,color:def.color,secId:'transfer',secColor:def.color,acc:acc,amount:nextVal,amt:nextVal,source:acc,destination:kind,rowId:def.transferRow||kind+'_fund',timestamp:ts});
      else removeTransaction(cur,id);
      rebuildFundStats();

    recalcExp(sec,row); recalcBal(); refreshFundCards(); renderPie(); renderTxns(); queueSave({month:cur,refreshTransactions:true});
  } else if(t.classList.contains('ei')){
    var sec=t.dataset.sec,row=t.dataset.row,acc=t.dataset.acc;
    ensureMonthData(cur);
    if(!ST[cur].expenses[row]) ST[cur].expenses[row]={};
    var nextVal=parseFloat(t.value)||0,tsKey='_ts_'+acc,prevVal=getX(cur,row,acc);
    ST[cur].expenses[row][acc]=nextVal;
    if(nextVal>0&&nextVal!==prevVal) ST[cur].expenses[row][tsKey]=Date.now();
    else if(nextVal<=0) delete ST[cur].expenses[row][tsKey];
    var secs=getSecs(),secObj=null,rowObj=null;
    secs.forEach(function(s){ if(s.id===sec) secObj=s; s.rows.forEach(function(r){ if(r.id===row) rowObj=r; }); });
    if(nextVal>0) upsertTransaction(cur,{id:txId(['expense',cur,row,acc]),type:'expense',transactionType:'Expense',name:rowObj?rowObj.name:row,emoji:rowObj?rowObj.emoji:'💸',color:ROW_C[getRowIdx(row)],secId:sec,secColor:secObj?secObj.color:'#378ADD',acc:acc,amount:nextVal,amt:nextVal,source:acc,destination:'expense',rowId:row,timestamp:ST[cur].expenses[row][tsKey]||Date.now()});
    else removeTransaction(cur,txId(['expense',cur,row,acc]));
    recalcExp(sec,row); recalcBal(); renderPie(); renderTxns(); queueSave({month:cur,refreshTransactions:true});
  }
}
function recalcBal(){
  var t=calc(cur),TT=getTT();
  [['ob_hsbc','ob_sbi'],['sal_hsbc','sal_sbi'],['oth_hsbc','oth_sbi'],['red_travel_hsbc','red_travel_sbi'],['red_emergency_hsbc','red_emergency_sbi']].forEach(function(p){
    var hv=getInc(cur,p[0]),sv=getInc(cur,p[1]);
    var el=R('comb-'+p[0]); if(el) el.textContent=(hv+sv)>0?fmtF(hv+sv):'—';
  });
  [['h-avail',t.hA],['s-avail',t.sA],['c-avail',t.totA],['h-spent',t.hSp],['s-spent',t.sSp],['c-spent',t.totSp]].forEach(function(f){ var el=R(f[0]); if(el) el.textContent=fmtF(f[1]); });
  var hc=R('h-close'),sc=R('s-close'),cc=R('c-close');
  if(hc){ hc.textContent=fmtF(t.hC); hc.className='bc clos '+(t.hC>=0?'pos':'neg'); }
  if(sc){ sc.textContent=fmtF(t.sC); sc.className='bc clos '+(t.sC>=0?'pos':'neg'); }
  if(cc){ cc.textContent=fmtF(t.hC+t.sC); cc.className='bc clos '+((t.hC+t.sC)>=0?'pos':'neg'); }
  var rem=TT-getKpiBudgetUsed(t);
  var kpi=R('kpi-cards');
  if(kpi) kpi.outerHTML=renderKpiCards(t,TT,rem,getSecs());
}
function recalcExp(secId,rowId){
  var secs=getSecs(),row=null;
  secs.forEach(function(s){ s.rows.forEach(function(r){ if(r.id===rowId) row=r; }); });
  if(!row) return;
  var kind=FUND_ROWS[rowId],hv=kind?getMonthTransfers(cur,kind,'hsbc'):getX(cur,rowId,'hsbc'),sv=kind?getMonthTransfers(cur,kind,'sbi'):getX(cur,rowId,'sbi'),tot=hv+sv,diff=tot-row.target;
  var tEl=R('tot-'+secId+'-'+rowId),dEl=R('diff-'+secId+'-'+rowId);
  var hI=document.querySelector('[data-row="'+rowId+'"][data-acc="hsbc"]');
  var sI=document.querySelector('[data-row="'+rowId+'"][data-acc="sbi"]');
  if(tEl) tEl.textContent=tot>0?fmtF(tot):'—';
  if(hI) hI.classList.toggle('over',tot>row.target&&hv>0);
  if(sI) sI.classList.toggle('over',tot>row.target&&sv>0);
  if(dEl){ if(tot===0) dEl.innerHTML='<span class="bdg nt">—</span>'; else if(diff>0) dEl.innerHTML='<span class="bdg ov">+'+fmtF(diff)+'</span>'; else dEl.innerHTML='<span class="bdg ok">'+fmtF(diff)+'</span>'; }
  var sec=null; secs.forEach(function(s){ if(s.id===secId) sec=s; });
  if(sec){
    var sA=0,sT=0;
    sec.rows.forEach(function(r){ if(!isFundTransferRow(r.id)) sA+=getX(cur,r.id,'hsbc')+getX(cur,r.id,'sbi'); });
    sT=getAllocationAmount(sec);
    var el=R('sa-'+secId); if(el){ el.textContent=fmtF(sA); el.className='exp-value'+(sA>sT?' bad':''); }
    var rem=sT-sA,pct=sT>0?Math.round((sA/sT)*100):0;
    var statusClass=pct<=100?'ok':pct<=130?'warn':'critical',statusText=pct<=100?'On Track':pct<=130?'Slightly Over':'Critical';
    var sr=R('sr-'+secId),sp=R('sp-'+secId),sm=R('sm-'+secId),ss=R('ss-'+secId),sf=R('sf-'+secId);
    if(sr){ sr.textContent=rem>=0?fmtF(rem):'-'+fmtF(Math.abs(rem)); sr.className='exp-value '+(rem>=0?'good':'bad'); }
    if(sp) sp.textContent=pct+'% of target';
    if(sm){ sm.textContent=rem>=0?fmtF(rem)+' left':'Over budget by '+fmtF(Math.abs(rem)); sm.className=rem>=0?'good':'bad'; }
    if(ss){ ss.textContent=statusText; ss.className='exp-status '+statusClass; }
    if(sf&&sf.closest('.exp-sec')) sf.closest('.exp-sec').style.setProperty('--pct',pct+'%');
  }
}

    +'<div class="gtxn-body"><aside class="gtxn-panel"><div class="gtxn-panel-title">Sections</div><div class="gtxn-section-list" id="gtxn-section-list">'+secHtml+'</div></aside>'
    +'<section class="gtxn-panel gtxn-form-card"><div class="gtxn-illustration">💼</div><div class="gtxn-panel-title">Transaction Form</div>'
    +'<div class="gtxn-type-row"><button id="gtxn-type-expense" class="gtxn-type '+(s.type==='expense'?'active':'')+'" onclick="updateTransactionState(\'type\',\'expense\')">Expense</button><button id="gtxn-type-income" class="gtxn-type '+(s.type==='income'?'active':'')+'" onclick="updateTransactionState(\'type\',\'income\')">Income</button></div>'
    +'<div class="gtxn-form-grid"><div class="gtxn-amount-wrap"><label class="gtxn-panel-title" for="gtxn-amount">Amount</label><div class="gtxn-amount-box"><span class="gtxn-currency">₹</span><input id="gtxn-amount" class="gtxn-amount" type="number" min="0" value="'+escAttr(s.amount||'')+'" oninput="handleTransactionAmountInput(this)" placeholder="0" autocomplete="off" inputmode="decimal"/></div><div class="gtxn-live-preview" id="gtxn-live-preview">'+escHtml(preview)+'</div></div>'
    +'<div class="gtxn-field" data-icon="📊"><label for="gtxn-category">Category</label><select id="gtxn-category" onchange="updateTransactionState(\'rowId\',this.value)">'+transactionCategoryOptions(rows,s.rowId)+'</select></div>'
    +'<div class="gtxn-field" data-icon="🏦"><label for="gtxn-bank">Bank Account</label><select id="gtxn-bank" onchange="updateTransactionState(\'bank\',this.value)">'+transactionBankOptions(banks,s.bank)+'</select></div>'
    +'<div class="gtxn-field" data-icon="📅"><label for="gtxn-date">Date</label><input id="gtxn-date" type="date" value="'+escAttr(s.date)+'" '+(s.useNow?'disabled':'')+' onchange="updateTransactionState(\'date\',this.value)"/></div>'
    +'<div class="gtxn-field" data-icon="⏰"><label for="gtxn-time">Time</label><input id="gtxn-time" type="time" value="'+escAttr(s.time)+'" '+(s.useNow?'disabled':'')+' onchange="updateTransactionState(\'time\',this.value)"/></div>'
    +'<div class="gtxn-field full gtxn-note-field" data-icon="✎"><label for="gtxn-description">Description</label><textarea id="gtxn-description" maxlength="220" oninput="handleTransactionDescriptionInput(this)" placeholder="Add notes about this transaction...">'+escHtml(s.description||'')+'</textarea></div>'
    +'<div class="gtxn-field full"><label class="gtxn-toggle"><input id="gtxn-use-now" type="checkbox" '+(s.useNow?'checked':'')+' onchange="updateTransactionState(\'useNow\',this.checked)"/> ✓ Use current date & time</label></div></div>'
    +'<div class="gtxn-error" id="gtxn-error"></div><div class="gtxn-actions"><button onclick="closeTransactionModal()">Cancel</button><button class="primary" onclick="saveGlobalTransaction()">Save Transaction ✓</button></div></section>'
    +'<aside class="gtxn-panel"><div class="gtxn-panel-title">Summary</div><div class="gtxn-summary" id="gtxn-summary">'+buildTransactionSummaryHtml(s,p)+'</div></aside></div></div></div>';
}function showTransactionError(msg){var el=R('gtxn-error');if(el){el.textContent=msg;el.classList.add('show')}}
function saveGlobalTransaction(){var s=transactionModalState,p=getTransactionPreview();if(!s)return;var amount=Math.round(cleanNumber(s.amount));if(amount<=0){showTransactionError('Amount must be greater than zero.');return}if(!p.row&&s.type!=='income'){showTransactionError('Choose a category.');return}if(!s.bank){showTransactionError('Choose a bank account.');return}var key=monthKeyFromDate(s.date),ts=transactionTimestamp(s.date,s.time),type=s.type==='income'?'income':(p.isTransfer?'transfer':'expense'),existing=s.id?findTxnLocation(s.id,s.originalKey):null;if(existing){applyTransactionEffects(existing.tx,-1);removeTransaction(existing.key,existing.tx.id)}ensureMonthData(key);var sec=p.sec||{},row=p.row||{},id=s.id||('gts_'+Date.now()+'_'+Math.random().toString(36).slice(2,8));var tx={id:id,type:type,transactionType:type==='income'?'Income':(type==='transfer'?'Fund Transfer':'Expense'),name:type==='income'?'Income':(row.name||'Transaction'),description:(s.description||'').trim().slice(0,220),note:(s.description||'').trim().slice(0,220),emoji:type==='income'?'?':(row.emoji||'??'),color:sec.color||'#378ADD',secId:sec.id||'income',secColor:sec.color||'#378ADD',section:sec.title||'',category:row.name||'Income',rowId:row.id||'income',acc:s.bank,bank:s.bank,amount:amount,amt:amount,source:s.bank,destination:type==='transfer'?p.fundKind:(type==='income'?s.bank:'expense'),date:s.date,time:s.time,timestamp:ts,month:key.split('-')[0],year:key.split('-')[1],monthKey:key,incomeField:type==='income'?incomeFieldForType(type,s.bank):undefined};applyTransactionEffects(tx,1);upsertTransaction(key,tx);closeTransactionModal();refreshAfterTransaction(key)}
function deleteGlobalTransaction(id,key){var loc=findTxnLocation(id,key);if(!loc)return;if(!confirm('Delete this transaction? Its financial impact will be reversed.'))return;applyTransactionEffects(loc.tx,-1);removeTransaction(loc.key,id);refreshAfterTransaction(loc.key)}
function renderCharts(app){
  var secs=getSecs(),months=sortedKeys();
  if(!months.length){ app.innerHTML='<div class="empty"><span class="empty-icon">📊</span><h3>No data yet</h3><p>Add a month first</p></div>'; return; }
  if(!cur||!ST[cur]) cur=months[months.length-1];
  var parts=cur.split('-'),m=parts[0],y=parts[1],TT=getTT();
  app.innerHTML='<div class="page-header"><div class="page-title">📈 Charts</div><div class="page-sub">'+escHtml(m)+' '+escHtml(y)+' · spending breakdown & trends</div></div>'
    +'<div class="vtabs"><button class="vtab" onclick="setView(\'tracker\')">📊 Tracker</button><button class="vtab active" onclick="setView(\'charts\')">📈 Charts</button><button class="vtab" onclick="setView(\'settings\')">⚙️ Settings</button></div>'
    +'<div class="cgrid" id="cg"></div>'
    +'<div class="ccrd" style="margin-bottom:1.25rem"><div class="ctitle">📅 All months — spending vs target</div><div class="lrow"><span class="leg"><span class="ldot" style="background:#E0DDD9"></span>Target</span><span class="leg"><span class="ldot" style="background:#7F77DD"></span>Actual</span><span class="leg"><span class="ldot" style="background:#E24B4A"></span>Over</span></div><div style="position:relative;height:'+Math.max(200,months.length*44+60)+'px"><canvas id="ca"></canvas></div></div>';
  var cg=R('cg');
  secs.forEach(function(sec){
    var col=safeColor(sec.color);
    var labels=sec.rows.map(function(r){ return r.emoji+' '+r.name; });
    var targets=sec.rows.map(function(r){ return r.target; });
    var actuals=sec.rows.map(function(r){ return isFundTransferRow(r.id)?0:getX(cur,r.id,'hsbc')+getX(cur,r.id,'sbi'); });
    var card=document.createElement('div'); card.className='ccrd';
    card.innerHTML='<div class="ctitle">'+escHtml(sec.icon+' '+sec.title)+'</div><div class="lrow"><span class="leg"><span class="ldot" style="background:#E0DDD9"></span>Target</span><span class="leg"><span class="ldot" style="background:'+escAttr(col)+'"></span>Actual</span></div><div style="position:relative;height:'+Math.max(80,sec.rows.length*46+60)+'px"><canvas id="c-'+escAttr(sec.id)+'"></canvas></div>';
    cg.appendChild(card);
    if(sec.rows.length>0){
      aCharts.push(new Chart(R('c-'+sec.id),{
        type:'bar',
        data:{labels:labels,datasets:[{label:'Target',data:targets,backgroundColor:'#E0DDD9',borderRadius:6,barPercentage:0.6,categoryPercentage:0.75},{label:'Actual',data:actuals,backgroundColor:actuals.map(function(v,i){ return v>targets[i]?'#E24B4A':col; }),borderRadius:6,barPercentage:0.6,categoryPercentage:0.75}]},
        options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){ return fmtF(c.raw); }}}},scales:{x:{ticks:{color:'#A89888',callback:function(v){ return fmt(v); },font:{size:10,family:'Montserrat,sans-serif'}},grid:{color:'rgba(59,31,14,0.05)'}},y:{ticks:{color:'#6B5C4E',font:{size:11,family:'Montserrat,sans-serif'}},grid:{display:false}}}}
      }));
    }
  });
  var secA=secs.map(function(sec){ return sec.rows.reduce(function(a,r){ return a+(isFundTransferRow(r.id)?0:getX(cur,r.id,'hsbc')+getX(cur,r.id,'sbi')); },0); });
  var gA=secA.reduce(function(a,v){ return a+v; },0);
  var dCard=document.createElement('div'); dCard.className='ccrd';
  var dLeg=secs.map(function(s,i){ var pct=gA>0?((secA[i]/gA)*100).toFixed(0)+'%':'0%'; return '<span class="leg"><span class="ldot" style="background:'+escAttr(safeColor(s.color))+'"></span>'+escHtml(s.icon+' '+pct)+'</span>'; }).join('');
  dCard.innerHTML='<div class="ctitle">🍩 Spending breakdown</div><div class="lrow">'+dLeg+'</div><div style="position:relative;height:220px"><canvas id="cdnt"></canvas></div>';
  cg.appendChild(dCard);
  aCharts.push(new Chart(R('cdnt'),{type:'doughnut',data:{labels:secs.map(function(s){ return s.title; }),datasets:[{data:secA,backgroundColor:secs.map(function(s){ return s.color; }),borderWidth:3,borderColor:'#F5F4F0',hoverOffset:10}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){ return c.label+': '+fmtF(c.raw); }}}}}}));
  var hT=secs.reduce(function(a,s){ return a+s.rows.reduce(function(b,r){ return b+(isFundTransferRow(r.id)?0:getX(cur,r.id,'hsbc')); },0); },0);
  var sT2=secs.reduce(function(a,s){ return a+s.rows.reduce(function(b,r){ return b+(isFundTransferRow(r.id)?0:getX(cur,r.id,'sbi')); },0); },0);
  var aCard=document.createElement('div'); aCard.className='ccrd';
  aCard.innerHTML='<div class="ctitle">🏦 HSBC vs SBI</div><div class="lrow"><span class="leg"><span class="ldot" style="background:#378ADD"></span>HSBC '+fmtF(hT)+'</span><span class="leg"><span class="ldot" style="background:#1D9E75"></span>SBI '+fmtF(sT2)+'</span></div><div style="position:relative;height:220px"><canvas id="cacc"></canvas></div>';
  cg.appendChild(aCard);
  aCharts.push(new Chart(R('cacc'),{type:'doughnut',data:{labels:['HSBC','SBI'],datasets:[{data:[hT,sT2],backgroundColor:['#378ADD','#1D9E75'],borderWidth:3,borderColor:'#F5F4F0',hoverOffset:10}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){ return c.label+': '+fmtF(c.raw); }}}}}}));
  var allL=months.map(function(k){ var p=k.split('-'); return p[0].slice(0,3)+' '+p[1]; });
  var allA=months.map(function(k){ return secs.reduce(function(a,sec){ return a+sec.rows.reduce(function(b,r){ return b+(isFundTransferRow(r.id)?0:getX(k,r.id,'hsbc')+getX(k,r.id,'sbi')); },0); },0); });
  aCharts.push(new Chart(R('ca'),{
    type:'bar',
    data:{labels:allL,datasets:[{label:'Target',data:months.map(function(){ return TT; }),backgroundColor:'#E0DDD9',borderRadius:6,barPercentage:0.5,categoryPercentage:0.75},{label:'Actual',data:allA,backgroundColor:allA.map(function(v){ return v>TT?'#E24B4A':'#7F77DD'; }),borderRadius:6,barPercentage:0.5,categoryPercentage:0.75}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){ return fmtF(c.raw); }}}},scales:{x:{ticks:{color:'#A89888',callback:function(v){ return fmt(v); },font:{size:10,family:'Montserrat,sans-serif'}},grid:{color:'rgba(59,31,14,0.05)'}},y:{ticks:{color:'#6B5C4E',font:{size:11,family:'Montserrat,sans-serif'}},grid:{display:false}}}}
  }));
}
loadState();
</script>
